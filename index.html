/* ── safe clipboard copy (works on HTTP too) ── */
function safeCopy(text, cb) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(cb).catch(() => fallback(text, cb));
  } else {
    fallback(text, cb);
  }
}
function fallback(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); cb(); } catch(e){}
  document.body.removeChild(ta);
}

/* helpers */
function parseMD(text){
  if(!text||!text.trim()) return null;

  // ── Phase 1: Normalise line endings ──
  const raw = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');

  // ── Phase 2: Reconstruct table lines ──
  // Strategy: a "table line" is any line that contains "|"
  // Lines without "|" that follow a table line are cell continuations
  const lines = raw.split('\n');
  const tableLines = [];
  for(const line of lines){
    const t2 = line.trim();
    if(!t2) continue;
    if(t2.includes('|')){
      tableLines.push(t2);
    } else if(tableLines.length > 0){
      // Append as continuation to previous line
      tableLines[tableLines.length-1] += ' ' + t2;
    }
  }

  if(tableLines.length < 2) return null;

  // ── Phase 3: Split each line into cells ──
  // Handle both "| a | b |" and "a | b | c" formats
  function splitRow(line){
    // Remove optional leading/trailing |
    const stripped = line.replace(/^\|/, '').replace(/\|$/, '');
    return stripped.split('|').map(c => c.trim());
  }

  // ── Phase 4: Detect & skip separator rows (|---|---|) ──
  function isSeparator(line){
    return /^[\|\-\s:=]+$/.test(line);
  }

  // ── Phase 5: Find header row index (first non-separator row) ──
  let headerIdx = -1;
  for(let i=0; i<tableLines.length; i++){
    if(!isSeparator(tableLines[i])){ headerIdx = i; break; }
  }
  if(headerIdx < 0) return null;

  // ── Phase 5b: map columns by header names when possible ──
  const hdr = splitRow(tableLines[headerIdx]).map(h=>h.toLowerCase());
  const findCol = (keys)=>hdr.findIndex(h=>keys.some(k=>h.includes(k)));
  const hMax = findCol(['قصو','العلامة','علامة','max','score','points','ניקוד','ציון']);
  const hSec = findCol(['القسم','قسم','section','part','פרק','יחידה']);
  const hQ   = findCol(['رقم','number','q#','מספר']);
  const hBl  = findCol(['بلوم','bloom','core','בלום','עיקרית']);
  const hCt  = findCol(['ثانوي','موضوع','مضمون','content','topic','secondary','משנית','נושא']);
  const byHeader = hMax>=0 && hQ>=0 && hMax!==hQ;

  // ── Phase 6: Parse data rows ──
  const data = [];
  for(let i = headerIdx+1; i < tableLines.length; i++){
    const row = tableLines[i];
    if(isSeparator(row)) continue;

    const cells = splitRow(row);
    if(cells.length < 2) continue;

    if(byHeader){
      const mv = parseFloat(String(cells[hMax]||'').replace(',','.').replace(/[^\d.]/g,''));
      if(isNaN(mv) || mv<=0) continue;
      const g=(i)=>i>=0?(cells[i]||'').replace(/\*\*/g,'').trim():'';
      data.push({section:g(hSec), qNum:g(hQ), bloomSkill:g(hBl), contentSkill:g(hCt), max:mv});
      continue;
    }

    // Find the rightmost cell that is a valid score (number 1-100)
    // We scan from right to left
    let scoreIdx = -1;
    let scoreVal = 0;
    for(let k = cells.length-1; k >= 0; k--){
      const raw2 = cells[k].replace(/[^\d.]/g,'');
      if(!raw2) continue;
      const v = parseFloat(raw2);
      if(!isNaN(v) && v > 0 && v <= 100){
        scoreIdx = k;
        scoreVal = v;
        break;
      }
    }

    // If no numeric score found, skip this row
    // BUT — if we have at least 2 cells and the last cell is empty or a label,
    // try assigning score = 0 so the row still shows in preview
    if(scoreIdx < 0){
      // Last attempt: any number anywhere
      for(let k=0; k<cells.length; k++){
        const raw2 = cells[k].replace(/[^\d.]/g,'');
        if(raw2){ const v=parseFloat(raw2); if(!isNaN(v)&&v>=0&&v<=100){scoreIdx=k;scoreVal=v;break;} }
      }
      if(scoreIdx < 0) continue;
    }

    // Assign columns based on position relative to score
    // Columns before score: [section?, qNum?, bloom?, content?]
    const pre = cells.slice(0, scoreIdx);
    const section      = pre[0] || '';
    const qNum         = pre[1] || '';
    const bloomSkill   = pre[2] || '';
    const contentSkill = pre[3] || '';

    // Skip rows where all meaningful fields are empty (likely a stray line)
    if(!section && !qNum && !bloomSkill && !contentSkill && !scoreVal) continue;

    data.push({ section, qNum, bloomSkill, contentSkill, max: scoreVal });
  }

  return data.length > 0 ? data : null;
}

function parseScores(raw){
  const rows=raw.split('\n').map(r=>r.split('\t'));
  let sc=[];
  rows.forEach(r=>{const v=parseFloat(r[r.length-1]);if(!isNaN(v)&&v>=0&&v<=100)sc.push(v);});
  if(!sc.length) rows.forEach(r=>{const v=parseFloat(r[r.length-2]);if(!isNaN(v)&&v>=0&&v<=100)sc.push(v);});
  return sc;
}


function avg(sc){return sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:0;}

function presetBands(lang,n){
  const p=(BAND_PRESETS[lang]||BAND_PRESETS.ar)[n]||BAND_PRESETS.ar[4];
  return p.map(([name,min])=>({name,min}));
}
function bandColor(bands,i){return (BAND_STRONG[bands.length]||BAND_STRONG[4])[i]||'#6b7280';}
function bandLight(bands,i){return (BAND_LIGHT[bands.length]||BAND_LIGHT[4])[i]||'F3F4F6';}
function bandUpper(bands,i){return i<bands.length-1?bands[i+1].min:100;}
function bandIndex(score,bands){
  let idx=0;
  for(let i=0;i<bands.length;i++){ if(score>=bands[i].min) idx=i; }
  return idx;
}
/* returns null if valid, otherwise an error key */
function validateBands(bands){
  if(!Array.isArray(bands)||bands.length<4||bands.length>6) return 'count';
  if(Number(bands[0].min)!==0) return 'first';
  for(let i=0;i<bands.length;i++){
    const b=bands[i];
    if(!String(b.name||'').trim()) return 'name';
    const m=Number(b.min);
    if(b.min===''||isNaN(m)||m<0||m>=100) return 'range';
    if(i>0&&m<=Number(bands[i-1].min)) return 'order';
  }
  return null;
}
function bandRangeLabel(bands,i){
  const lo=bands[i].min, hi=bandUpper(bands,i);
  return `${lo} – ${hi}`;
}
function buildDist(scores,bands){
  const counts=bands.map(()=>0);
  scores.forEach(s=>{counts[bandIndex(s,bands)]++;});
  return counts;
}

      ['איך משתמשים בקובץ?',''],
      ['1','עברו לגיליון «הזנת ציונים» ורשמו את שמות התלמידים בעמודה השנייה.'],
      ['2','הזינו את ציון כל תלמיד בכל שאלה. לא ניתן להזין ציון הגבוה מהניקוד המרבי.'],
      ['3','אם תלמיד לא ענה על שאלה – רשמו 0. שורה של תלמיד חסר השאירו ריקה לגמרי.'],
      ['4','הסכום, האחוז והרמה מחושבים אוטומטית והתאים נצבעים לפי המקרא.'],

      ['6','לשינוי הטווחים השתמשו בגיליון «טווחים».'],

      ['הערה','התאים המחושבים מוגנים מעריכה בטעות (ניתן לבטל: סקירה ← בטל הגנת גיליון).']

    num:'#', student:'Student Name', total:'Total', pct:'Percent %', level:'Level',
    qAvgPct:'Question Avg (of 100)', qAvgPts:'Avg Points', answered:'Students', helper:'helper',
    studentAvg:'Class Avg %', totalRow:'Total',
    kpi:'Key Indicators', nStudents:'Students Tested', classAvg:'Class Average', highest:'Highest', lowest:'Lowest', median:'Median', stdev:'Std. Deviation',

/* ═══════════ EXCEL BUILDER (ExcelJS) ═══════════ */
async function buildScreeningWorkbook(ExcelJS,{questions,bands,lang,teacher,subjectName,nStudents}){
  const L=XL[lang]||XL.ar;
  const N=Math.max(5,Math.min(60,parseInt(nStudents)||35));
  const Q=questions.length;
  const nb=bands.length;
  const wb=new ExcelJS.Workbook();
  wb.creator='ومضات ذكية مع منى مصطفى';
  wb.created=new Date();
  const FONT='Arial';
  const NAVY='1E3A5F', NAVY2='2C5282', GREY='F1F5F9', ZEBRA='F8FAFC', BORDER='CBD5E1';
  const col=(n)=>{let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}; // 0-based
  const q=(name)=>`'${name.replace(/'/g,"''")}'`;
  const thin={style:'thin',color:{argb:'FF'+BORDER}};
  const box={top:thin,left:thin,bottom:thin,right:thin};
  const fill=(hex)=>({type:'pattern',pattern:'solid',fgColor:{argb:'FF'+hex}});
  const center={horizontal:'center',vertical:'middle',wrapText:true};
  const style=(c,{bold=false,size=11,color='1F2937',bg=null,align=center,border=true,numFmt=null}={})=>{
    c.font={name:FONT,size,bold,color:{argb:'FF'+color}};
    if(bg) c.fill=fill(bg);
    c.alignment=align;
    if(border) c.border=box;
    if(numFmt) c.numFmt=numFmt;
  };
  const headerCell=(c,txt,bg=NAVY)=>{c.value=txt;style(c,{bold:true,color:'FFFFFF',bg});};
  const view=(extra={})=>[{rightToLeft:L.rtl,showGridLines:false,...extra}];
  const BLOOM_FILL={'تذكر':'E5E7EB','فهم':'DBEAFE','تطبيق':'D1FAE5','تحليل':'FEF3C7','تقييم':'FEE2E2','إبداع':'EDE9FE','ابداع':'EDE9FE',
    'Remember':'E5E7EB','Understand':'DBEAFE','Apply':'D1FAE5','Analyze':'FEF3C7','Analyse':'FEF3C7','Evaluate':'FEE2E2','Create':'EDE9FE',
    'זיכרון':'E5E7EB','הבנה':'DBEAFE','יישום':'D1FAE5','ניתוח':'FEF3C7','הערכה':'FEE2E2','יצירה':'EDE9FE'};
  const bloomFill=(s)=>{s=String(s||'');for(const k in BLOOM_FILL){if(s.includes(k))return BLOOM_FILL[k];}return 'F3F4F6';};

  const wsGuide=wb.addWorksheet(L.shGuide,{views:view(),properties:{tabColor:{argb:'FF64748B'}}});
  const wsG=wb.addWorksheet(L.shGrades,{views:view({state:'frozen',xSplit:2,ySplit:8}),properties:{tabColor:{argb:'FF'+NAVY}}});
  const wsE=wb.addWorksheet(L.shExam,{views:view({state:'frozen',ySplit:3}),properties:{tabColor:{argb:'FF7C3AED'}}});
  const wsS=wb.addWorksheet(L.shSummary,{views:view(),properties:{tabColor:{argb:'FF16A34A'}}});
  const wsB=wb.addWorksheet(L.shBands,{views:view(),properties:{tabColor:{argb:'FFEA580C'}}});
  const wsM=wb.addWorksheet('_meta',{state:'veryHidden'});

  /* ── Bands sheet (single source of truth for ranges) ── */
  wsB.columns=[{width:6},{width:26},{width:16},{width:16},{width:14}];
  wsB.mergeCells('A1:E1');
  wsB.getCell('A1').value=L.bandsTitle; style(wsB.getCell('A1'),{bold:true,size:16,color:'FFFFFF',bg:NAVY,border:false});
  wsB.getRow(1).height=34;
  wsB.mergeCells('A2:E2');
  wsB.getCell('A2').value=L.bandsNote; style(wsB.getCell('A2'),{size:10,color:'475569',border:false,align:{...center,horizontal:L.rtl?'right':'left'}});
  wsB.getRow(2).height=36;
  [L.num,L.band,L.minCol,L.to,L.colorCol].forEach((h,i)=>headerCell(wsB.getCell(4,i+1),h,NAVY2));
  const B0=5; // first band row
  bands.forEach((b,i)=>{
    const r=B0+i;
    wsB.getCell(r,1).value=i+1; style(wsB.getCell(r,1),{bg:GREY,bold:true});
    const cn=wsB.getCell(r,2); cn.value=b.name; style(cn,{bold:true}); cn.protection={locked:false};
    const cm=wsB.getCell(r,3); cm.value=Number(b.min); style(cm,{bold:true,bg:'FFFBEB'}); cm.protection={locked:i>0?false:true};
    const ct=wsB.getCell(r,4); ct.value= i<nb-1 ? {formula:`C${r+1}`} : 100; style(ct,{color:'475569'});
    const cc=wsB.getCell(r,5); cc.value=''; style(cc,{bg:bandLight(bands,i)});
    wsB.getRow(r).height=24;
    if(i>0){
      cm.dataValidation={type:'decimal',operator:'between',allowBlank:false,showErrorMessage:true,
        formulae:[`C${r-1}+0.01`,99.99],errorTitle:L.errTitle,error:L.bandsNote};
    }
  });
  const BL=B0+nb-1;
  const BMIN=(i)=>`${q(L.shBands)}!$C$${B0+i}`;
  const BNAME=(i)=>`${q(L.shBands)}!$B$${B0+i}`;
  const MINS=`${q(L.shBands)}!$C$${B0}:$C$${BL}`;
  const NAMES=`${q(L.shBands)}!$B$${B0}:$B$${BL}`;
  // Defined names so conditional formatting can refer to the bands from other sheets
  for(let i=0;i<nb;i++) wb.definedNames.add(`${q(L.shBands)}!$C$${B0+i}`,`BAND_MIN_${i+1}`);
  await wsB.protect('',{selectLockedCells:true,selectUnlockedCells:true,formatColumns:true});

  /* ── Grades sheet ── */
  const FQ=2;                    // first question column (0-based) → C
  const LQ=FQ+Q-1;
  const CT=LQ+1, CP=LQ+2, CL=LQ+3; // total, percent, level
  const R_SEC=4,R_QN=5,R_BL=6,R_TP=7,R_MX=8, R1=9, RN=R1+N-1;
  const R_AVGP=RN+1, R_AVGPCT=RN+2, R_HELP=RN+3;
  const qc=(j)=>col(FQ+j);
  const lastCol=col(CL);
  wsG.getColumn(1).width=5; wsG.getColumn(2).width=24;
  for(let j=0;j<Q;j++) wsG.getColumn(FQ+1+j).width=Q>20?8:10;
  wsG.getColumn(CT+1).width=11; wsG.getColumn(CP+1).width=11; wsG.getColumn(CL+1).width=16;

  wsG.mergeCells(`A1:${lastCol}1`);
  const info=[subjectName,teacher.grade&&`${L.grade}: ${teacher.grade}`,teacher.name&&`${L.teacher}: ${teacher.name}`,teacher.date&&`${L.date}: ${teacher.date}`].filter(Boolean).join('   •   ');
  wsG.getCell('A1').value=`${L.title}${info?'   —   '+info:''}`;
  style(wsG.getCell('A1'),{bold:true,size:15,color:'FFFFFF',bg:NAVY,border:false});
  wsG.getRow(1).height=34;
  // legend row
  wsG.getCell('B2').value=L.legend; style(wsG.getCell('B2'),{bold:true,border:false,color:'475569'});
  bands.forEach((b,i)=>{
    const c=wsG.getCell(2,3+i*2);
    wsG.mergeCells(2,3+i*2,2,4+i*2);
    c.value={formula:`${BNAME(i)}&" ("&${BMIN(i)}&"–"&${i<nb-1?BMIN(i+1):'100'}&")"`};
    style(c,{bold:true,size:9,bg:bandLight(bands,i),color:'1F2937'});
  });
  wsG.getRow(2).height=22; wsG.getRow(3).height=6;

  const rowLabels=[[R_SEC,L.section],[R_QN,L.qNum],[R_BL,L.bloom],[R_TP,L.topic],[R_MX,L.max]];
  rowLabels.forEach(([r,lbl])=>{
    wsG.mergeCells(r,1,r,2);
    const c=wsG.getCell(r,1); c.value=lbl; style(c,{bold:true,color:'FFFFFF',bg:NAVY2});
  });
  questions.forEach((qq,j)=>{
    const C=FQ+1+j;
    const s=wsG.getCell(R_SEC,C); s.value=qq.section||''; style(s,{bold:true,size:9,bg:'E2E8F0'});
    const n=wsG.getCell(R_QN,C); n.value=isNaN(Number(qq.qNum))||qq.qNum===''?String(qq.qNum||j+1):Number(qq.qNum); style(n,{bold:true,color:'FFFFFF',bg:NAVY});
    const b=wsG.getCell(R_BL,C); b.value=qq.bloomSkill||''; style(b,{size:9,bg:bloomFill(qq.bloomSkill)});
    const t=wsG.getCell(R_TP,C); t.value=qq.contentSkill||''; style(t,{size:8,color:'475569'});
    const m=wsG.getCell(R_MX,C); m.value=Number(qq.max)||0; style(m,{bold:true,color:'B91C1C',bg:'FEF2F2'});
  });
  // sections are NOT merged: every question keeps its section text so the summary formulas can group by it;
  // instead, a thicker border marks where a new section starts
  for(let j=1;j<Q;j++){
    if(String(questions[j].section||'')!==String(questions[j-1].section||'')){
      const side=L.rtl?'right':'left';
      for(let rr=R_SEC;rr<=R_MX;rr++){const c=wsG.getCell(rr,FQ+1+j);c.border={...c.border,[side]:{style:'medium',color:{argb:'FF'+NAVY}}};}
    }
  }
  [[CT,L.total],[CP,L.pct],[CL,L.level]].forEach(([c0,lbl])=>{
    wsG.mergeCells(R_SEC,c0+1,R_TP,c0+1);
    headerCell(wsG.getCell(R_SEC,c0+1),lbl);
  });
  const totMax=wsG.getCell(R_MX,CT+1); totMax.value={formula:`SUM(${qc(0)}${R_MX}:${qc(Q-1)}${R_MX})`}; style(totMax,{bold:true,color:'B91C1C',bg:'FEF2F2'});
  style(wsG.getCell(R_MX,CP+1),{bg:'FEF2F2'}); wsG.getCell(R_MX,CP+1).value=100;
  style(wsG.getCell(R_MX,CL+1),{bg:'FEF2F2'});
  wsG.getRow(R_TP).height=Q>15?48:36; wsG.getRow(R_BL).height=22;

  const TOT=`$${col(CT)}$${R_MX}`;
  for(let r=R1;r<=RN;r++){
    const zebra=(r-R1)%2?ZEBRA:'FFFFFF';
    const cn=wsG.getCell(r,1); cn.value=r-R1+1; style(cn,{bg:GREY,color:'64748B',size:10});
    const nm=wsG.getCell(r,2); style(nm,{bg:zebra,align:{vertical:'middle',horizontal:L.rtl?'right':'left',indent:1}}); nm.protection={locked:false};
    for(let j=0;j<Q;j++){
      const c=wsG.getCell(r,FQ+1+j);
      style(c,{bg:zebra,numFmt:'0.##'});
      c.protection={locked:false};
      c.dataValidation={type:'decimal',operator:'between',allowBlank:true,showErrorMessage:true,
        errorStyle:'stop',errorTitle:L.errTitle,error:L.errMsg,formulae:[0,`${qc(j)}$${R_MX}`]};
    }
    const rng=`${qc(0)}${r}:${qc(Q-1)}${r}`;
    const ct=wsG.getCell(r,CT+1); ct.value={formula:`IF(COUNT(${rng})=0,"",SUM(${rng}))`}; style(ct,{bold:true,bg:'F1F5F9',numFmt:'0.##'});
    const cp=wsG.getCell(r,CP+1); cp.value={formula:`IF(${col(CT)}${r}="","",ROUND(${col(CT)}${r}/${TOT}*100,1))`}; style(cp,{bold:true,numFmt:'0.0'});
    const cl=wsG.getCell(r,CL+1); cl.value={formula:`IF(${col(CP)}${r}="","",LOOKUP(${col(CP)}${r},${MINS},${NAMES}))`}; style(cl,{bold:true,size:10});
    wsG.getRow(r).height=20;
  }
  const PCT=`${q(L.shGrades)}!$${col(CP)}$${R1}:$${col(CP)}$${RN}`;
  const PCTL=`$${col(CP)}$${R1}:$${col(CP)}$${RN}`;
  const NST=`COUNT(${PCTL})`;
  // per-question rows
  [[R_AVGP,L.qAvgPts],[R_AVGPCT,L.qAvgPct]].forEach(([r,lbl])=>{
    wsG.mergeCells(r,1,r,2); headerCell(wsG.getCell(r,1),lbl,NAVY2);
  });
  for(let j=0;j<Q;j++){
    const C=qc(j);
    const a=wsG.getCell(R_AVGP,FQ+1+j);
    a.value={formula:`IF(${NST}=0,"",ROUND(SUM(${C}${R1}:${C}${RN})/${NST},2))`}; style(a,{bold:true,bg:GREY,numFmt:'0.##'});
    const p=wsG.getCell(R_AVGPCT,FQ+1+j);
    p.value={formula:`IF(OR(${NST}=0,${C}$${R_MX}=0),"",ROUND(SUM(${C}${R1}:${C}${RN})/(${C}$${R_MX}*${NST})*100,1))`}; style(p,{bold:true,numFmt:'0.0'});
    const h=wsG.getCell(R_HELP,FQ+1+j);
    h.value={formula:`IF(${C}${R_AVGPCT}="","",${C}${R_AVGPCT}+COLUMN()/100000)`}; h.font={color:{argb:'FFFFFFFF'},size:8};
  }
  const avgT=wsG.getCell(R_AVGP,CT+1); avgT.value={formula:`IF(${NST}=0,"",ROUND(AVERAGE(${col(CT)}${R1}:${col(CT)}${RN}),2))`}; style(avgT,{bold:true,bg:GREY,numFmt:'0.##'});
  const avgP=wsG.getCell(R_AVGPCT,CP+1); avgP.value={formula:`IF(${NST}=0,"",ROUND(AVERAGE(${PCTL}),1))`}; style(avgP,{bold:true,numFmt:'0.0'});
  const avgL=wsG.getCell(R_AVGPCT,CL+1); avgL.value={formula:`IF(${col(CP)}${R_AVGPCT}="","",LOOKUP(${col(CP)}${R_AVGPCT},${MINS},${NAMES}))`}; style(avgL,{bold:true,size:10});
  wsG.getRow(R_HELP).hidden=true;

  // Conditional formatting – traffic light by percentage of max
  const cfRules=(ratioExpr)=>bands.map((b,i)=>{
    const lo=`BAND_MIN_${i+1}`;
    const cond= i<nb-1 ? `AND(${ratioExpr}>=${lo},${ratioExpr}<BAND_MIN_${i+2})` : `${ratioExpr}>=${lo}`;
    return {type:'expression',priority:i+1,formulae:[cond],style:{fill:{type:'pattern',pattern:'solid',bgColor:{argb:'FF'+bandLight(bands,i)}},font:{color:{argb:'FF'+bandColor(bands,i).slice(1)}}}};
  });
  const a1=`${qc(0)}${R1}`;
  wsG.addConditionalFormatting({ref:`${qc(0)}${R1}:${qc(Q-1)}${RN}`,
    rules:cfRules(`IF(ISNUMBER(${a1}),${a1}/${qc(0)}$${R_MX}*100,-1)`)});
  wsG.addConditionalFormatting({ref:`${qc(0)}${R_AVGPCT}:${qc(Q-1)}${R_AVGPCT}`,
    rules:cfRules(`IF(ISNUMBER(${qc(0)}${R_AVGPCT}),${qc(0)}${R_AVGPCT},-1)`)});
  wsG.addConditionalFormatting({ref:`${col(CP)}${R1}:${col(CL)}${R_AVGPCT}`,
    rules:cfRules(`IF(ISNUMBER($${col(CP)}${R1}),$${col(CP)}${R1},-1)`)});

  wsG.pageSetup={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9,
    margins:{left:0.3,right:0.3,top:0.4,bottom:0.4,header:0.2,footer:0.2},printTitlesRow:`${R_SEC}:${R_MX}`};
  await wsG.protect('',{selectLockedCells:true,selectUnlockedCells:true,formatColumns:true,formatRows:true});

  /* ── Exam analysis sheet ── */
  const exCols=[L.num,L.section,L.qNum,L.bloom,L.topic,L.max,L.studentAvg,L.level];
  wsE.columns=[{width:5},{width:16},{width:11},{width:14},{width:38},{width:12},{width:14},{width:16}];
  wsE.mergeCells('A1:H1'); wsE.getCell('A1').value=`${L.shExam}${subjectName?' — '+subjectName:''}`;
  style(wsE.getCell('A1'),{bold:true,size:15,color:'FFFFFF',bg:NAVY,border:false}); wsE.getRow(1).height=32;
  exCols.forEach((h,i)=>headerCell(wsE.getCell(3,i+1),h,NAVY2)); wsE.getRow(3).height=24;
  const gref=(c,r)=>`${q(L.shGrades)}!${c}$${r}`;
  questions.forEach((qq,j)=>{
    const r=4+j, zebra=j%2?ZEBRA:'FFFFFF', C=qc(j);
    const vals=[j+1,{formula:gref(C,R_SEC)},{formula:gref(C,R_QN)},{formula:gref(C,R_BL)},{formula:gref(C,R_TP)},{formula:gref(C,R_MX)},
      {formula:gref(C,R_AVGPCT)},{formula:`IF(G${r}="","",LOOKUP(G${r},${MINS},${NAMES}))`}];
    vals.forEach((v,i)=>{const c=wsE.getCell(r,i+1);c.value=v;
      style(c,{bg:i===3?bloomFill(qq.bloomSkill):zebra,bold:i===2||i>=5,numFmt:i===6?'0.0':null,
        align:i===4?{vertical:'middle',horizontal:L.rtl?'right':'left',wrapText:true,indent:1}:center});});
    wsE.getRow(r).height=22;
  });
  const ER=4+Q;
  wsE.mergeCells(ER,1,ER,5); headerCell(wsE.getCell(ER,1),L.totalRow);
  const es=wsE.getCell(ER,6); es.value={formula:`SUM(F4:F${ER-1})`}; style(es,{bold:true,color:'FFFFFF',bg:NAVY});
  const ea=wsE.getCell(ER,7); ea.value={formula:gref(col(CP),R_AVGPCT)}; style(ea,{bold:true,color:'FFFFFF',bg:NAVY,numFmt:'0.0'});
  style(wsE.getCell(ER,8),{bg:NAVY});
  wsE.addConditionalFormatting({ref:`G4:H${ER-1}`,rules:cfRules(`IF(ISNUMBER($G4),$G4,-1)`)});
  await wsE.protect('',{selectLockedCells:true,selectUnlockedCells:true,formatColumns:true});

  /* ── Summary sheet ── */
  wsS.columns=[{width:30},{width:14},{width:14},{width:14},{width:14},{width:34}];
  wsS.mergeCells('A1:F1'); wsS.getCell('A1').value=`${L.shSummary}${info?' — '+info:''}`;
  style(wsS.getCell('A1'),{bold:true,size:15,color:'FFFFFF',bg:NAVY,border:false}); wsS.getRow(1).height=34;
  let r=3;
  const sectionTitle=(txt,bg='0F766E')=>{wsS.mergeCells(r,1,r,6);const c=wsS.getCell(r,1);c.value=txt;
    style(c,{bold:true,size:13,color:'FFFFFF',bg,align:{vertical:'middle',horizontal:L.rtl?'right':'left',indent:1}});wsS.getRow(r).height=26;r++;};
  // KPIs
  sectionTitle(L.kpi);
  const kpis=[[L.nStudents,`COUNT(${PCT})`,'0'],[L.classAvg,`IFERROR(ROUND(AVERAGE(${PCT}),1),"")`,'0.0'],
    [L.median,`IFERROR(ROUND(MEDIAN(${PCT}),1),"")`,'0.0'],[L.highest,`IFERROR(IF(COUNT(${PCT})=0,"",MAX(${PCT})),"")`,'0.0'],
    [L.lowest,`IFERROR(IF(COUNT(${PCT})=0,"",MIN(${PCT})),"")`,'0.0'],[L.stdev,`IFERROR(ROUND(STDEV(${PCT}),1),"")`,'0.0']];
  const kStart=r;
  kpis.forEach(([lbl,f,fmt])=>{
    const lc=wsS.getCell(r,1), vc=wsS.getCell(r,2);
    lc.value=lbl; style(lc,{bold:true,bg:GREY,align:{vertical:'middle',horizontal:L.rtl?'right':'left',indent:1}});
    vc.value={formula:f}; style(vc,{bold:true,size:13,color:NAVY,numFmt:fmt});
    wsS.getRow(r).height=22; r++;
  });

/* ═══════════ READ A FILLED WORKBOOK BACK ═══════════ */
function cellNum(v){
  if(v===null||v===undefined||v==='') return null;
  if(typeof v==='object'){ if('result' in v) v=v.result; else if(v.richText) v=v.richText.map(x=>x.text).join(''); else return null; }
  const n=typeof v==='number'?v:parseFloat(String(v).replace(',','.'));
  return isNaN(n)?null:n;
}
function cellText(v){
  if(v===null||v===undefined) return '';
  if(typeof v==='object'){ if('result' in v) return String(v.result??''); if(v.richText) return v.richText.map(x=>x.text).join(''); if(v.text) return String(v.text); }
  return String(v);
}
async function readScreeningWorkbook(ExcelJS,arrayBuffer){
  const wb=new ExcelJS.Workbook();
  await wb.xlsx.load(arrayBuffer);
  const meta=wb.getWorksheet('_meta');
  if(!meta) throw new Error('nometa');
  const M=JSON.parse(cellText(meta.getCell('A1').value));
  const ws=wb.getWorksheet(M.gradesSheet)||wb.worksheets[1];
  const wsB=wb.getWorksheet(M.bandsSheet);
  let bands=null;
  if(wsB){
    const b=[];
    for(let i=0;i<M.bandCount;i++){
      const r=M.bandsFirstRow+i;
      b.push({name:cellText(wsB.getCell(r,2).value).trim(),min:cellNum(wsB.getCell(r,3).value)});
    }
    if(!validateBands(b)) bands=b;
  }
  const questions=[];
  for(let j=0;j<M.qCount;j++){
    const C=M.firstQCol+j;
    let sec=cellText(ws.getCell(M.secRow,C).value);
    questions.push({section:sec,qNum:cellText(ws.getCell(M.qnRow,C).value),bloomSkill:cellText(ws.getCell(M.blRow,C).value),
      contentSkill:cellText(ws.getCell(M.tpRow,C).value),max:cellNum(ws.getCell(M.maxRow,C).value)||0});
  }
  const totalMax=questions.reduce((a,q)=>a+q.max,0);
  const students=[];
  for(let r=M.firstRow;r<=M.lastRow;r++){
    const vals=questions.map((q,j)=>cellNum(ws.getCell(r,M.firstQCol+j).value));
    if(vals.every(v=>v===null)) continue;
    const name=cellText(ws.getCell(r,2).value).trim()||`#${r-M.firstRow+1}`;
    const pts=vals.map((v,j)=>Math.min(Math.max(v||0,0),questions[j].max));
    const total=pts.reduce((a,b)=>a+b,0);
    students.push({name,pts,total,pct:totalMax?Math.round(total/totalMax*1000)/10:0});
  }
  return {questions,students,bands,totalMax,lang:M.lang};
}

/* analytics from a read workbook */
function analyticsFromWorkbook(res,bands){
  const {questions,students}=res;
  const n=students.length;
  const scores=students.map(s=>s.pct);
  const perQuestion=questions.map((q,j)=>({...q,avgPct:n&&q.max?Math.round(students.reduce((a,s)=>a+s.pts[j],0)/(q.max*n)*1000)/10:0}));
  const group=(key)=>{
    const m={};
    perQuestion.forEach((q,j)=>{const k=String(q[key]||'').trim();if(!k)return;(m[k]=m[k]||{name:k,max:0,got:0,count:0});m[k].max+=q.max;m[k].count++;m[k].got+=students.reduce((a,s)=>a+s.pts[j],0);});
    return Object.values(m).map(g=>({name:g.name,count:g.count,avgPct:n&&g.max?Math.round(g.got/(g.max*n)*1000)/10:0}));
  };
  return {
    scores, counts:buildDist(scores,bands), bands:bands.map(b=>({...b})),
    totalStudents:n, average:n?scores.reduce((a,b)=>a+b,0)/n:0,
    students:students.map(s=>({name:s.name,pct:s.pct,total:s.total})),
    perQuestion, byBloom:group('bloomSkill'), bySection:group('section')
  };
}

async function downloadWorkbook(wb,filename){
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* reads Claude's reply: a ```json block (or any {"questions":[...]} object) */
function parseExamJSON(text){
  if(!text) return null;
  const tryParse=(str)=>{try{return JSON.parse(str);}catch{return null;}};
  let obj=null;
  const fence=text.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(fence) obj=tryParse(fence[1].trim());
  if(!obj){const i=text.indexOf('{'),j=text.lastIndexOf('}');if(i>=0&&j>i) obj=tryParse(text.slice(i,j+1));}
  if(!obj){const i=text.indexOf('['),j=text.lastIndexOf(']');if(i>=0&&j>i){const a=tryParse(text.slice(i,j+1));if(Array.isArray(a))obj={questions:a};}}
  const arr=obj&&(Array.isArray(obj)?obj:obj.questions);
  if(!Array.isArray(arr)) return null;
  const data=arr.map((q,k)=>({
    section:String(q.section??q.part??'').trim(),
    qNum:String(q.q??q.qNum??q.number??k+1).trim(),
    bloomSkill:String(q.bloom??q.bloomSkill??'').trim(),
    contentSkill:String(q.topic??q.contentSkill??q.skill??'').trim(),
    max:parseFloat(String(q.max??q.score??'').replace(',','.'))
  })).filter(q=>!isNaN(q.max)&&q.max>0);
  return data.length?data:null;
}
function parseExamReply(text){return parseExamJSON(text)||parseMD(text);}

function doExportDocx(data){
  const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,AlignmentType,HeadingLevel}=docx;
  const t=data.t;
  const mp=(txt)=>new Paragraph({children:[new TextRun({text:String(txt),size:22})]});
  const mh=(txt,c)=>new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:txt,bold:true,size:28,color:c||'1d4ed8'})]});
  const mc=(txt,bold,fill)=>new TableCell({
    shading:fill?{fill}:undefined,
    children:[new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:String(txt),bold:!!bold,size:20})]})]
  });
  const B=data.analytics.bands, G=planGroups(B);
  const gl=(k,base)=>base+' ('+G[k].map(i=>B[i].name).join(' / ')+')';
  const doc2=new Document({sections:[{properties:{},children:[
    new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:t.mainTitle,bold:true,size:44,color:'ea580c'})]}),
    new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:t.mainSub,size:26,color:'92400e'})]}),
    new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:t.planTitle,size:28,bold:true})]}),
    new Paragraph({}),
    mh('1. '+t.distSection),
    mp(t.totalStudents+': '+data.analytics.totalStudents),
    ...data.analytics.bands.map((b,i)=>mp(`${b.name} (${bandRangeLabel(data.analytics.bands,i)}): ${data.analytics.counts[i]}`)),
    mp(t.avgLabel+': '+data.analytics.average.toFixed(1)),
    new Paragraph({}),
    mh('2. '+t.timeframe,'7c3aed'),
    mp(t.workPeriod+': '+(data.plan.period||t.notSet)),
    mp(t.weeklyHours+': '+(data.plan.hours||t.notSet)),
    mp(t.evalMethod+': '+(data.plan.assessment||t.notSet)),
    mp(t.reEvalDate+': '+(data.plan.reEvalDate||t.notSet)),
    mp(t.availableRes+': '+(data.plan.resources||t.notSet)),
    new Paragraph({}),
    mh('3. '+t.strategiesTitle,'ea580c'),
    new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[
      new TableRow({children:[mc(t.groupTarget,true,'dbeafe'),mc(t.strategy,true,'dbeafe')]}),
      new TableRow({children:[mc(gl('intensive',t.intensiveGroup),true,'fee2e2'),mc(t.intensiveStr)]}),
      new TableRow({children:[mc(gl('strategic',t.strategicGroup),true,'fef9c3'),mc(t.strategicStr)]}),
      new TableRow({children:[mc(gl('enrich',t.enrichGroup),true,'dcfce7'),mc(t.enrichStr)]}),
    ]}),
    new Paragraph({}),
    mp(t.mainTitle+' — '+new Date().toLocaleDateString()),
  ]}]});
  Packer.toBlob(doc2).then(blob=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='plan_'+(data.teacher.grade||'class')+'.docx';
    a.click();
  });
}

                      <div className="h-52 bg-white rounded-xl border p-3"><canvas ref={cmpCanvasRef}></canvas></div>
                      <div className="grid grid-cols-2 gap-3 mt-3 text-sm">
                        <div className="bg-blue-100 rounded-xl p-3 text-center">
                          <div className="font-bold text-blue-700">{t.exam1}</div>
                          <div className="text-2xl font-black text-blue-900">{analytics.average.toFixed(1)}</div>
                          <div className="text-xs text-blue-500">{t.avgLabel}</div>
                        </div>
                        <div className="bg-orange-100 rounded-xl p-3 text-center">
                          <div className="font-bold text-orange-700">{t.exam2}</div>
                          <div className="text-2xl font-black text-orange-900">{compareAna.average.toFixed(1)}</div>
                          <div className="text-xs text-orange-500">{t.avgLabel}</div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}
              {!showPlan&&(
                <div className="bg-white border-2 border-dashed border-gray-200 rounded-2xl p-6 space-y-4 no-print">
                  <h3 style={{fontSize:"1.4rem",fontWeight:800,color:"#1e3a5f",marginBottom:"4px"}}>{t.interventionTitle}</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {[['resources',t.resources,t.resourcesHint,'text','md:col-span-2'],['period',t.period,t.periodHint,'text',''],['hours',t.hours,t.hoursHint,'text',''],['assessment',t.assessment,t.assessmentHint,'text',''],['reEvalDate',t.reEval,'','date','']].map(([k,lbl,ph,type,ex])=>(
                      <div key={k} className={ex}>
                        <label style={{display:"block",fontSize:"1rem",fontWeight:700,color:"#374151",marginBottom:"6px"}}>{lbl}</label>
                        <input type={type} value={plan[k]} placeholder={ph}
                          onChange={e=>setPlan({...plan,[k]:e.target.value})}
                          style={{width:"100%",padding:"13px 16px",borderRadius:"13px",border:"2px solid #e5e7eb",outline:"none",fontSize:"1rem",fontFamily:"Cairo,sans-serif"}}
                          onFocus={e=>e.target.style.borderColor="#f97316"}
                          onBlur={e=>e.target.style.borderColor="#e5e7eb"}/>
                      </div>
                    ))}
                  </div>
                  <button onClick={()=>setShowPlan(true)} className="glow-orange w-full bg-gradient-to-r from-gray-800 to-gray-700 text-white font-bold py-3 rounded-xl cursor-pointer">
                    ✨ {t.generatePlan}
                  </button>
                </div>
              )}
              {showPlan&&(
                <div id="plan-print-area" className="bg-white rounded-2xl border shadow-sm p-6 md:p-8 space-y-6 fade-in print-ok" dir={dir}>
                  <div className="flex flex-wrap gap-3 justify-end no-print">
                    <button onClick={()=>setShowPlan(false)} style={{display:'inline-flex',alignItems:'center',gap:'8px',padding:'10px 22px',borderRadius:'14px',background:'linear-gradient(135deg,#1e3a5f,#0f2749)',color:'white',fontWeight:700,fontSize:'1rem',border:'none',cursor:'pointer',boxShadow:'0 4px 14px rgba(15,39,73,.35)'}}>
                      <span>{dir==='rtl'?'→':'←'}</span> {t.back}
                    </button>
                    <button onClick={()=>doExportDocx({t,analytics,plan,teacher})} className="glow-blue px-4 py-2 rounded-xl bg-blue-600 text-white text-sm font-bold cursor-pointer">📄 {t.downloadDocx}</button>
                    <button onClick={doExportPDF} className="px-4 py-2 rounded-xl bg-red-600 text-white text-sm font-bold hover:bg-red-700 transition cursor-pointer">📑 {t.downloadPdf}</button>
                    <button onClick={()=>window.print()} className="px-4 py-2 rounded-xl bg-gray-800 text-white text-sm font-bold hover:bg-gray-700 transition cursor-pointer">🖨️ {t.print}</button>
                  </div>
                  <div className="text-center border-b-2 border-orange-100 pb-5" style={{background:'linear-gradient(135deg,#fff7ed,#fff)',borderRadius:'16px',padding:'24px'}}>
                    <img src={LOGO} alt="logo" style={{width:'58px',height:'58px',borderRadius:'12px',objectFit:'cover',margin:'0 auto 10px'}} onError={e=>e.target.style.display='none'}/>
                    <div style={{fontSize:'1.4rem',fontWeight:900,color:'#ea580c'}}>{t.mainTitle}</div>
                    <div style={{fontSize:'.82rem',fontWeight:700,color:'#92400e',marginTop:'4px'}}>{t.mainSub}</div>
                    <div style={{fontSize:'1.05rem',fontWeight:700,color:'#1f2937',marginTop:'10px'}}>{t.planTitle}</div>
                    <div style={{fontSize:'.78rem',color:'#6b7280',marginTop:'4px'}}>{teacher.grade} — {t.subjects[subject]} — {teacher.date}</div>
                    <div style={{fontSize:'.73rem',color:'#9ca3af'}}>{teacher.name}</div>
                  </div>
                  <section>
                    <h3 style={{fontSize:'1.05rem',fontWeight:700,color:'#1d4ed8',borderBottom:'2px solid #dbeafe',paddingBottom:'6px',marginBottom:'10px'}}>1. {t.distSection}</h3>
                    <ul style={{listStyle:'none',display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',fontSize:'.88rem'}}>
                      {[['📊 '+t.totalStudents,analytics.totalStudents,'#374151'],...analytics.bands.map((b,k)=>[`● ${b.name} (${bandRangeLabel(analytics.bands,k)})`,analytics.counts[k],bandColor(analytics.bands,k)]),['📈 '+t.avgLabel,analytics.average.toFixed(1),'#374151']].map(([lbl,val,c])=>(
                        <li key={lbl} style={{background:'#f9fafb',borderRadius:'10px',padding:'8px 12px',color:c}}><strong>{lbl}:</strong> {val}</li>
                      ))}
                    </ul>
                  </section>
                  <section>
                    <h3 style={{fontSize:'1.05rem',fontWeight:700,color:'#7c3aed',borderBottom:'2px solid #ede9fe',paddingBottom:'6px',marginBottom:'10px'}}>2. {t.timeframe}</h3>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',fontSize:'.85rem'}}>
                      {[[t.workPeriod,plan.period||t.notSet],[t.weeklyHours,plan.hours||t.notSet],[t.evalMethod,plan.assessment||t.notSet],[t.reEvalDate,plan.reEvalDate||t.notSet],[t.availableRes,plan.resources||t.notSet]].map(([k,v])=>(
                        <div key={k} style={{background:'#faf5ff',borderRadius:'10px',padding:'10px 12px',border:'1px solid #ede9fe'}}>
                          <div style={{fontWeight:700,color:'#6d28d9',fontSize:'.78rem'}}>{k}</div>
                          <div style={{color:'#1f2937',marginTop:'3px'}}>{v}</div>
                        </div>
                      ))}
                    </div>
                  </section>
                  <section>
                    <h3 style={{fontSize:'1.05rem',fontWeight:700,color:'#ea580c',borderBottom:'2px solid #fed7aa',paddingBottom:'6px',marginBottom:'10px'}}>3. {t.strategiesTitle}</h3>
                    <div style={{overflowX:'auto'}}>
                      <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.83rem'}}>
                        <thead>
                          <tr style={{background:'#f1f5f9'}}>
                            <th style={{border:'1px solid #e5e7eb',padding:'10px',width:'28%',textAlign:'center'}}>{t.groupTarget}</th>
                            <th style={{border:'1px solid #e5e7eb',padding:'10px',textAlign:'start'}}>{t.strategy}</th>
                          </tr>
                        </thead>
                        <tbody>
                          {(()=>{const G=planGroups(analytics.bands),nm=(k)=>G[k].map(i=>analytics.bands[i].name).join(' / ');return [[t.intensiveGroup,'#dc2626','#fee2e2',t.intensiveStr,nm('intensive')],[t.strategicGroup,'#d97706','#fef9c3',t.strategicStr,nm('strategic')],[t.enrichGroup,'#059669','#dcfce7',t.enrichStr,nm('enrich')]];})().map(([grp,c,bg,str,sub])=>(
                            <tr key={grp} style={{background:bg}}>
                              <td style={{border:'1px solid #e5e7eb',padding:'10px',fontWeight:700,textAlign:'center',color:c}}>{grp}<div style={{fontSize:'.72rem',fontWeight:600,color:'#6b7280',marginTop:'2px'}}>{sub}</div></td>
                              <td style={{border:'1px solid #e5e7eb',padding:'10px',color:'#374151'}}>{str}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </section>
                  <p style={{fontSize:'.72rem',color:'#9ca3af',textAlign:'center',paddingTop:'8px'}}>{t.mainTitle} — {new Date().toLocaleDateString()}</p>
                </div>
              )}
            </div>
          )}
          <div className="no-print" style={{marginTop:"40px",paddingTop:"16px",borderTop:"1px solid #f1f5f9",textAlign:"center",fontSize:".8rem",color:"#9ca3af"}}>{t.mainTitle} — v4.0</div>
        </div>
      </div>
    </div>
    </>
  );
};

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
