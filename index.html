    _origWarn.apply(console, args);

/* ── safe clipboard copy (works on HTTP too) ── */
function safeCopy(text, cb) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(cb).catch(() => fallback(text, cb));
  } else {
    fallback(text, cb);
  }
}
function fallback(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); cb(); } catch(e){}
  document.body.removeChild(ta);
}

/* helpers */
function parseMD(text){
  if(!text||!text.trim()) return null;

  // ── Phase 1: Normalise line endings ──
  const raw = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');

  // ── Phase 2: Reconstruct table lines ──
  // Strategy: a "table line" is any line that contains "|"
  // Lines without "|" that follow a table line are cell continuations
  const lines = raw.split('\n');
  const tableLines = [];
  for(const line of lines){
    const t2 = line.trim();
    if(!t2) continue;
    if(t2.includes('|')){
      tableLines.push(t2);
    } else if(tableLines.length > 0){
      // Append as continuation to previous line
      tableLines[tableLines.length-1] += ' ' + t2;
    }
  }

  if(tableLines.length < 2) return null;

  // ── Phase 3: Split each line into cells ──
  // Handle both "| a | b |" and "a | b | c" formats
  function splitRow(line){
    // Remove optional leading/trailing |
    const stripped = line.replace(/^\|/, '').replace(/\|$/, '');
    return stripped.split('|').map(c => c.trim());
  }

  // ── Phase 4: Detect & skip separator rows (|---|---|) ──
  function isSeparator(line){
    return /^[\|\-\s:=]+$/.test(line);
  }

  // ── Phase 5: Find header row index (first non-separator row) ──
  let headerIdx = -1;
  for(let i=0; i<tableLines.length; i++){
    if(!isSeparator(tableLines[i])){ headerIdx = i; break; }
  }
  if(headerIdx < 0) return null;

  // ── Phase 5b: map columns by header names when possible ──
  const hdr = splitRow(tableLines[headerIdx]).map(h=>h.toLowerCase());
  const findCol = (keys)=>hdr.findIndex(h=>keys.some(k=>h.includes(k)));
  const hMax = findCol(['قصو','العلامة','علامة','max','score','points','ניקוד','ציון']);
  const hSec = findCol(['القسم','قسم','section','part','פרק','יחידה']);
  const hQ   = findCol(['رقم','number','q#','מספר']);
  const hBl  = findCol(['بلوم','bloom','core','בלום','עיקרית']);
  const hCt  = findCol(['ثانوي','موضوع','مضمون','content','topic','secondary','משנית','נושא']);
  const byHeader = hMax>=0 && hQ>=0 && hMax!==hQ;

  // ── Phase 6: Parse data rows ──
  const data = [];
  for(let i = headerIdx+1; i < tableLines.length; i++){
    const row = tableLines[i];
    if(isSeparator(row)) continue;

    const cells = splitRow(row);
    if(cells.length < 2) continue;

    if(byHeader){
      const mv = parseFloat(String(cells[hMax]||'').replace(',','.').replace(/[^\d.]/g,''));
      if(isNaN(mv) || mv<=0) continue;
      const g=(i)=>i>=0?(cells[i]||'').replace(/\*\*/g,'').trim():'';
      data.push({section:g(hSec), qNum:g(hQ), bloomSkill:g(hBl), contentSkill:g(hCt), max:mv});
      continue;
    }

    // Find the rightmost cell that is a valid score (number 1-100)
    // We scan from right to left
    let scoreIdx = -1;
    let scoreVal = 0;
    for(let k = cells.length-1; k >= 0; k--){
      const raw2 = cells[k].replace(/[^\d.]/g,'');
      if(!raw2) continue;
      const v = parseFloat(raw2);
      if(!isNaN(v) && v > 0 && v <= 100){
        scoreIdx = k;
        scoreVal = v;
        break;
      }
    }

    // If no numeric score found, skip this row
    // BUT — if we have at least 2 cells and the last cell is empty or a label,
    // try assigning score = 0 so the row still shows in preview
    if(scoreIdx < 0){
      // Last attempt: any number anywhere
      for(let k=0; k<cells.length; k++){
        const raw2 = cells[k].replace(/[^\d.]/g,'');
        if(raw2){ const v=parseFloat(raw2); if(!isNaN(v)&&v>=0&&v<=100){scoreIdx=k;scoreVal=v;break;} }
      }
      if(scoreIdx < 0) continue;
    }

    // Assign columns based on position relative to score
    // Columns before score: [section?, qNum?, bloom?, content?]
    const pre = cells.slice(0, scoreIdx);
    const section      = pre[0] || '';
    const qNum         = pre[1] || '';
    const bloomSkill   = pre[2] || '';
    const contentSkill = pre[3] || '';

    // Skip rows where all meaningful fields are empty (likely a stray line)
    if(!section && !qNum && !bloomSkill && !contentSkill && !scoreVal) continue;

    data.push({ section, qNum, bloomSkill, contentSkill, max: scoreVal });
  }

  return data.length > 0 ? data : null;
}

function parseScores(raw){
  const rows=raw.split('\n').map(r=>r.split('\t'));
  let sc=[];
  rows.forEach(r=>{const v=parseFloat(r[r.length-1]);if(!isNaN(v)&&v>=0&&v<=100)sc.push(v);});
  if(!sc.length) rows.forEach(r=>{const v=parseFloat(r[r.length-2]);if(!isNaN(v)&&v>=0&&v<=100)sc.push(v);});
  return sc;
}


function avg(sc){return sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:0;}

/* traffic-light gradient: red (lowest) → yellow → green (highest), Excel's classic scale */
const TL_FILL=['F8696B','FFEB84','63BE7B'];
const TL_TEXT=['B91C1C','A16207','15803D'];
function lerpHex(a,b,t){
  const pa=[0,2,4].map(i=>parseInt(a.substr(i,2),16)), pb=[0,2,4].map(i=>parseInt(b.substr(i,2),16));
  return pa.map((v,i)=>Math.round(v+(pb[i]-v)*t).toString(16).padStart(2,'0')).join('').toUpperCase();
}
function traffic(t,stops){
  t=Math.max(0,Math.min(1,t));
  return t<=0.5?lerpHex(stops[0],stops[1],t*2):lerpHex(stops[1],stops[2],(t-0.5)*2);
}
function bandT(bands,i){return bands.length>1?i/(bands.length-1):1;}
function bandLight(bands,i){return traffic(bandT(bands,i),TL_FILL);}               // cell fill (no #)
function bandSoft(bands,i){return lerpHex(bandLight(bands,i),'FFFFFF',0.6);}         // pale version for web backgrounds
function bandColor(bands,i){return '#'+traffic(bandT(bands,i),TL_TEXT);}            // strong text / chart color

const BAND_PRESETS = {

/* a band list is [{name,min,max}]: both bounds are inclusive and shown to the teacher (e.g. 55 – 64).
   Classification uses the lower bounds only, so a score that falls between two ranges (e.g. 64.5) counts in the lower one. */
function presetBands(lang,n){
  const p=(BAND_PRESETS[lang]||BAND_PRESETS.ar)[n]||BAND_PRESETS.ar[4];
  return p.map(([name,min],i)=>({name,min,max:i<p.length-1?p[i+1][1]-1:100}));
}
/* older drafts/files stored only lower bounds: derive the upper bound of each range */
function normalizeBands(bands){
  if(!Array.isArray(bands)) return bands;
  return bands.map((b,i)=>{
    if(b.max!==undefined&&b.max!==null&&b.max!=='') return {...b};
    const next=bands[i+1];
    return {...b,max:next?Number(next.min)-1:100};
  });
}
/* the step used to guess the neighbouring bound: 1 for whole numbers, 0.1 otherwise */
function boundStep(v){return Number.isInteger(Number(v))?1:0.1;}
function roundB(v){return Math.round(Number(v)*10)/10;}
function bandTop(bands){const m=bands[bands.length-1].max;return (m===undefined||m===null||m==='')?100:Number(m);}
function bandUpper(bands,i){
  const m=bands[i].max;
  if(m!==undefined&&m!==null&&m!=='') return Number(m);
  return i<bands.length-1?Number(bands[i+1].min)-1:100;
}
/* scores below the lowest bound count in the first band, scores above the top in the last band */
function bandIndex(score,bands){
  let idx=0;
  for(let i=1;i<bands.length;i++){ if(score>=Number(bands[i].min)) idx=i; }
  return idx;
}
/* returns null if valid, otherwise an error key */
function validateBands(bands){
  if(!Array.isArray(bands)||bands.length<4||bands.length>6) return 'count';
  const bad=(v)=>v===''||v===null||v===undefined||isNaN(Number(v))||Number(v)<0||Number(v)>100;
  for(let i=0;i<bands.length;i++){
    const b=bands[i];
    if(!String(b.name||'').trim()) return 'name';
    if(bad(b.min)||bad(bandUpper(bands,i))) return 'range';
    if(bandUpper(bands,i)<Number(b.min)) return 'span';
    if(i>0&&Number(b.min)<=bandUpper(bands,i-1)) return 'order';
  }
  return null;
}
/* indexes i where a gap is left between range i and range i+1 (e.g. 54 → 60) */
function bandGaps(bands){
  const g=[];
  for(let i=0;i<bands.length-1;i++){
    const up=bandUpper(bands,i), nx=Number(bands[i+1].min);
    if(nx-up>boundStep(up)+1e-9) g.push(i);
  }
  return g;
}
function bandRangeLabel(bands,i){return `${Number(bands[i].min)} – ${bandUpper(bands,i)}`;}
function buildDist(scores,bands){
  const counts=bands.map(()=>0);
  scores.forEach(s=>{counts[bandIndex(s,bands)]++;});
  return counts;
}

const CLASS_LETTERS={ar:['أ','ب','ج','د','هـ','و','ز','ح','ط','ي','ك','ل'],he:['א','ב','ג','ד','ה','ו','ז','ח','ט','י','יא','יב'],en:['A','B','C','D','E','F','G','H','I','J','K','L']};
function defaultClassNames(lang,n,base){
  const L=CLASS_LETTERS[lang]||CLASS_LETTERS.ar;
  const b=String(base||'').trim()||({ar:'الصف',he:'כיתה',en:'Class'}[lang]||'الصف');
  if(n<=1) return [b];
  return Array.from({length:n},(_,i)=>`${b} ${L[i]||i+1}`);
}
/* Excel sheet names: ≤31 chars, no []:*?/\ , unique */
function sheetSafeNames(names,reserved){
  const used=new Set((reserved||[]).map(s=>s.toLowerCase()));
  return names.map((n,i)=>{
    let s=String(n||'').replace(/[\[\]:*?\/\\]/g,' ').replace(/^'+|'+$/g,'').trim().substring(0,28)||`#${i+1}`;
    let base=s,k=2;
    while(used.has(s.toLowerCase())){s=`${base.substring(0,25)} (${k++})`;}
    used.add(s.toLowerCase());
    return s;
  });
}

  wsB.getCell('A1').value=L.bandsTitle; style(wsB.getCell('A1'),{bold:true,size:16,color:'FFFFFF',bg:NAVY,border:false});

  wsB.mergeCells('A2:E2');
  wsB.getCell('A2').value=L.bandsNote; style(wsB.getCell('A2'),{size:10,color:'475569',border:false,align:{...center,horizontal:side}});
  wsB.getRow(2).height=56;
  [L.num,L.band,L.from,L.to,L.colorCol].forEach((h,i)=>headerCell(wsB.getCell(4,i+1),h,NAVY2));
  const B0=5, BL=B0+nb-1;
  const bandDV=(lo,hi)=>({type:'decimal',operator:'between',allowBlank:false,showErrorMessage:true,formulae:[lo,hi],errorTitle:L.errTitle,error:L.bandErrMsg});
  bands.forEach((b,i)=>{
    const r=B0+i;
    wsB.getCell(r,1).value=i+1; style(wsB.getCell(r,1),{bg:GREY,bold:true});
    const cn=wsB.getCell(r,2); cn.value=b.name; style(cn,{bold:true}); cn.protection={locked:false};
    const cm=wsB.getCell(r,3); cm.value=Number(b.min); style(cm,{bold:true,bg:'FFFBEB'}); cm.protection={locked:false};
    cm.dataValidation=bandDV(i===0?0:`D${r-1}+0.01`,`D${r}`);
    const ct=wsB.getCell(r,4); ct.value=bandUpper(bands,i); style(ct,{bold:true,bg:'FFFBEB'}); ct.protection={locked:false};
    ct.dataValidation=bandDV(`C${r}`,i<nb-1?`C${r+1}-0.01`:100);
    const cc=wsB.getCell(r,5); cc.value=''; style(cc,{bg:bandLight(bands,i)});
    wsB.getRow(r).height=24;
  });
  const BS=q(L.shBands);
  const BMIN=(i)=>`${BS}!$C$${B0+i}`;
  const BTO=(i)=>`${BS}!$D$${B0+i}`;
  const BNAME=(i)=>`${BS}!$B$${B0+i}`;
  const MINS=`${BS}!$C$${B0}:$C$${BL}`, NAMES=`${BS}!$B$${B0}:$B$${BL}`;
  for(let i=1;i<nb;i++) wb.definedNames.add(`${BS}!$C$${B0+i}`,`BAND_MIN_${i+1}`);
  /* Colour rules must not point to another sheet or to a defined name: Google Sheets, phone viewers
     and some previews ignore such rules (no traffic-light colours). So every sheet that is coloured
     gets a hidden helper column (ZZ) that copies the range limits, and the rules read only from it. */
  const HCOL='ZZ', HIDX=702;
  const BANDREF=(k)=>`$${HCOL}$${k}`;           // k = 2..nb  ↔  BAND_MIN_k
  [...classSheets,wsS,wsE].forEach(ws=>{
    for(let i=1;i<nb;i++) ws.getCell(`${HCOL}${i+1}`).value={formula:BMIN(i)};
    ws.getColumn(HIDX).hidden=true;
  });
  const levelOf=(ref)=>`IF(${ref}="","",LOOKUP(MAX(${ref},${BMIN(0)}),${MINS},${NAMES}))`;
  const legendText=(i)=>`${BNAME(i)}&" ("&${BMIN(i)}&"–"&${BTO(i)}&")"`;
  await wsB.protect('',{selectLockedCells:true,selectUnlockedCells:true,formatColumns:true});

  /* traffic-light conditional formatting: ratioExpr returns -1 for empty cells */
  const cfRules=(ratioExpr)=>bands.map((b,i)=>{
    const cond= i===0 ? `AND(${ratioExpr}>=0,${ratioExpr}<${BANDREF(2)})`
              : i<nb-1 ? `AND(${ratioExpr}>=${BANDREF(i+1)},${ratioExpr}<${BANDREF(i+2)})`
              : `${ratioExpr}>=${BANDREF(nb)}`;
    return {type:'expression',priority:i+1,formulae:[cond],
      style:{fill:{type:'pattern',pattern:'solid',bgColor:{argb:'FF'+bandLight(bands,i)}},font:{color:{argb:'FF'+DARK}}}};
  });
  const numOr=(ref)=>`IF(ISNUMBER(${ref}),${ref},-1)`;

  /* ── Class sheets ── */
  const FQ=2, LQ=FQ+Q-1, CT=LQ+1, CP=LQ+2, CL=LQ+3;
  const R_SEC=4,R_QN=5,R_BL=6,R_TP=7,R_MX=8, R1=9, RN=R1+N-1;
  const R_AVGP=RN+1, R_AVGPCT=RN+2, R_SUM=RN+3;
  const qc=(j)=>col(FQ+j);
  const lastCol=col(CL);
  const TOT=`$${col(CT)}$${R_MX}`, PCTL=`$${col(CP)}$${R1}:$${col(CP)}$${RN}`;
  const NLOC=`$${col(CT)}$${R_SUM}`;
  const CLS=classNames.map(n=>{const s=q(n);return{
    name:n, PCT:`${s}!${PCTL}`, N:`${s}!${NLOC}`,
    ROW:(r)=>`${s}!$${qc(0)}$${r}:$${qc(Q-1)}$${r}`,
    CELL:(j,r)=>`${s}!$${qc(j)}$${r}`
  };});

  classSheets.forEach((wsG,ci)=>{
    wsG.getColumn(1).width=5; wsG.getColumn(2).width=24;
    for(let j=0;j<Q;j++) wsG.getColumn(FQ+1+j).width=Q>20?8:10;
    wsG.getColumn(CT+1).width=11; wsG.getColumn(CP+1).width=11; wsG.getColumn(CL+1).width=16;
    wsG.mergeCells(`A1:${lastCol}1`);
    const head=[`${L.classLbl}: ${classNames[ci]}`,subjectName,teacher.name&&`${L.teacher}: ${teacher.name}`,teacher.date&&`${L.date}: ${teacher.date}`].filter(Boolean).join('   •   ');
    wsG.getCell('A1').value=`${L.title}   —   ${head}`;
    style(wsG.getCell('A1'),{bold:true,size:15,color:'FFFFFF',bg:NAVY,border:false});
    wsG.getRow(1).height=34;
    wsG.getCell('B2').value=L.legend; style(wsG.getCell('B2'),{bold:true,border:false,color:'475569'});
    bands.forEach((b,i)=>{
      const c=wsG.getCell(2,3+i*2);
      wsG.mergeCells(2,3+i*2,2,4+i*2);
      c.value={formula:legendText(i)};
      style(c,{bold:true,size:9,bg:bandLight(bands,i),color:DARK});
    });
    wsG.getRow(2).height=22; wsG.getRow(3).height=6;
    [[R_SEC,L.section],[R_QN,L.qNum],[R_BL,L.bloom],[R_TP,L.topic],[R_MX,L.max]].forEach(([r,lbl])=>{
      wsG.mergeCells(r,1,r,2);
      const c=wsG.getCell(r,1); c.value=lbl; style(c,{bold:true,color:'FFFFFF',bg:NAVY2});
    });
    questions.forEach((qq,j)=>{
      const C=FQ+1+j;
      const s=wsG.getCell(R_SEC,C); s.value=qq.section||''; style(s,{bold:true,size:9,bg:'E2E8F0'});
      const n=wsG.getCell(R_QN,C); n.value=isNaN(Number(qq.qNum))||qq.qNum===''?String(qq.qNum||j+1):Number(qq.qNum); style(n,{bold:true,color:'FFFFFF',bg:NAVY});
      const bl=wsG.getCell(R_BL,C); bl.value=qq.bloomSkill||''; style(bl,{size:9,bg:bloomFill(qq.bloomSkill)});
      const t=wsG.getCell(R_TP,C); t.value=qq.contentSkill||''; style(t,{size:8,color:'475569'});
      const m=wsG.getCell(R_MX,C); m.value=Number(qq.max)||0; style(m,{bold:true,color:'B91C1C',bg:'FEF2F2'});
    });
    for(let j=1;j<Q;j++){
      if(String(questions[j].section||'')!==String(questions[j-1].section||'')){
        for(let rr=R_SEC;rr<=R_MX;rr++){const c=wsG.getCell(rr,FQ+1+j);c.border={...c.border,[side]:{style:'medium',color:{argb:'FF'+NAVY}}};}
      }
    }
    [[CT,L.total],[CP,L.pct],[CL,L.level]].forEach(([c0,lbl])=>{
      wsG.mergeCells(R_SEC,c0+1,R_TP,c0+1);
      headerCell(wsG.getCell(R_SEC,c0+1),lbl);
    });
    const totMax=wsG.getCell(R_MX,CT+1); totMax.value={formula:`SUM(${qc(0)}${R_MX}:${qc(Q-1)}${R_MX})`}; style(totMax,{bold:true,color:'B91C1C',bg:'FEF2F2'});
    wsG.getCell(R_MX,CP+1).value=100; style(wsG.getCell(R_MX,CP+1),{bg:'FEF2F2'});
    style(wsG.getCell(R_MX,CL+1),{bg:'FEF2F2'});
    wsG.getRow(R_TP).height=Q>15?48:36; wsG.getRow(R_BL).height=22;

    for(let r=R1;r<=RN;r++){
      const zebra=(r-R1)%2?ZEBRA:'FFFFFF';
      const cn=wsG.getCell(r,1); cn.value=r-R1+1; style(cn,{bg:GREY,color:'64748B',size:10});
      const nm=wsG.getCell(r,2); style(nm,{bg:zebra,align:startAlign}); nm.protection={locked:false};
      for(let j=0;j<Q;j++){
        const c=wsG.getCell(r,FQ+1+j);
        style(c,{bg:zebra,numFmt:'0.##'});
        c.protection={locked:false};
        c.dataValidation={type:'decimal',operator:'between',allowBlank:true,showErrorMessage:true,
          errorStyle:'stop',errorTitle:L.errTitle,error:L.errMsg,formulae:[0,`${qc(j)}$${R_MX}`]};
      }
      const rng=`${qc(0)}${r}:${qc(Q-1)}${r}`;
      const ct=wsG.getCell(r,CT+1); ct.value={formula:`IF(COUNT(${rng})=0,"",SUM(${rng}))`}; style(ct,{bold:true,bg:'F1F5F9',numFmt:'0.##'});
      const cp=wsG.getCell(r,CP+1); cp.value={formula:`IF(${col(CT)}${r}="","",ROUND(${col(CT)}${r}/${TOT}*100,1))`}; style(cp,{bold:true,numFmt:'0.0'});
      const cl=wsG.getCell(r,CL+1); cl.value={formula:levelOf(`${col(CP)}${r}`)}; style(cl,{bold:true,size:10});
      wsG.getRow(r).height=20;
    }
    // per-question rows
    [[R_AVGP,L.qAvgPts],[R_AVGPCT,L.qAvgPct]].forEach(([r,lbl])=>{wsG.mergeCells(r,1,r,2); headerCell(wsG.getCell(r,1),lbl,NAVY2);});
    const sumN=wsG.getCell(R_SUM,CT+1); sumN.value={formula:`COUNT(${PCTL})`}; sumN.font={color:{argb:'FFFFFFFF'},size:8};
    for(let j=0;j<Q;j++){
      const C=qc(j);
      const sm=wsG.getCell(R_SUM,FQ+1+j); sm.value={formula:`SUM(${C}${R1}:${C}${RN})`}; sm.font={color:{argb:'FFFFFFFF'},size:8};
      const a=wsG.getCell(R_AVGP,FQ+1+j);
      a.value={formula:`IF(${NLOC}=0,"",ROUND(${C}${R_SUM}/${NLOC},2))`}; style(a,{bold:true,bg:GREY,numFmt:'0.##'});
      const p=wsG.getCell(R_AVGPCT,FQ+1+j);
      p.value={formula:`IF(OR(${NLOC}=0,${C}$${R_MX}=0),"",ROUND(${C}${R_SUM}/(${C}$${R_MX}*${NLOC})*100,1))`}; style(p,{bold:true,numFmt:'0.0'});
    }
    const avgT=wsG.getCell(R_AVGP,CT+1); avgT.value={formula:`IF(${NLOC}=0,"",ROUND(AVERAGE(${col(CT)}${R1}:${col(CT)}${RN}),2))`}; style(avgT,{bold:true,bg:GREY,numFmt:'0.##'});
    const avgP=wsG.getCell(R_AVGPCT,CP+1); avgP.value={formula:`IF(${NLOC}=0,"",ROUND(AVERAGE(${PCTL}),1))`}; style(avgP,{bold:true,numFmt:'0.0'});
    const avgL=wsG.getCell(R_AVGPCT,CL+1); avgL.value={formula:levelOf(`${col(CP)}${R_AVGPCT}`)}; style(avgL,{bold:true,size:10});
    wsG.getRow(R_SUM).hidden=true;

    const a1=`${qc(0)}${R1}`;
    wsG.addConditionalFormatting({ref:`${qc(0)}${R1}:${qc(Q-1)}${RN}`,rules:cfRules(`IF(ISNUMBER(${a1}),${a1}/${qc(0)}$${R_MX}*100,-1)`)});
    wsG.addConditionalFormatting({ref:`${qc(0)}${R_AVGPCT}:${qc(Q-1)}${R_AVGPCT}`,rules:cfRules(numOr(`${qc(0)}${R_AVGPCT}`))});
    wsG.addConditionalFormatting({ref:`${col(CP)}${R1}:${col(CL)}${R_AVGPCT}`,rules:cfRules(numOr(`$${col(CP)}${R1}`))});
    wsG.pageSetup={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9,
      margins:{left:0.3,right:0.3,top:0.4,bottom:0.4,header:0.2,footer:0.2},printTitlesRow:`${R_SEC}:${R_MX}`};
  });
  for(const wsG of classSheets) await wsG.protect('',{selectLockedCells:true,selectUnlockedCells:true,formatColumns:true,formatRows:true});

  /* shared formula pieces across classes */
  const sumNs=CLS.map(c=>c.N).join(',');
  const allPct=CLS.map(c=>c.PCT).join(',');

  /* ── Exam analysis sheet: structure + per-class question averages ── */
  const EX_FIXED=6;                    // #, section, q, bloom, topic, max
  const exClassCol=(k)=>EX_FIXED+1+k;  // 1-based
  const EX_ALL=multi?EX_FIXED+nC+1:EX_FIXED+1;
  const EX_LVL=EX_ALL+1, EX_HELP=EX_ALL+2;
  const exWidths=[5,16,11,14,36,11];
  exWidths.forEach((w,i)=>wsE.getColumn(i+1).width=w);
  if(multi) classNames.forEach((n,k)=>wsE.getColumn(exClassCol(k)).width=12);
  wsE.getColumn(EX_ALL).width=14; wsE.getColumn(EX_LVL).width=16; wsE.getColumn(EX_HELP).width=4; wsE.getColumn(EX_HELP).hidden=true;
  wsE.mergeCells(1,1,1,EX_LVL); wsE.getCell(1,1).value=`${L.shExam}${info?' — '+info:''}`;
  style(wsE.getCell(1,1),{bold:true,size:15,color:'FFFFFF',bg:NAVY,border:false}); wsE.getRow(1).height=32;
  [L.num,L.section,L.qNum,L.bloom,L.topic,L.max].forEach((h,i)=>headerCell(wsE.getCell(3,i+1),h,NAVY2));
  if(multi) classNames.forEach((n,k)=>headerCell(wsE.getCell(3,exClassCol(k)),n,'0F766E'));
  headerCell(wsE.getCell(3,EX_ALL),multi?L.overallPct:L.avgPct,NAVY); headerCell(wsE.getCell(3,EX_LVL),L.level,NAVY);
  wsE.getRow(3).height=30;
  const E0=4;
  questions.forEach((qq,j)=>{
    const r=E0+j, zebra=j%2?ZEBRA:'FFFFFF';
    const vals=[j+1,qq.section||'',isNaN(Number(qq.qNum))||qq.qNum===''?String(qq.qNum||j+1):Number(qq.qNum),qq.bloomSkill||'',qq.contentSkill||'',Number(qq.max)||0];
    vals.forEach((v,i)=>{const c=wsE.getCell(r,i+1);c.value=v;
      style(c,{bg:i===3?bloomFill(qq.bloomSkill):zebra,bold:i===2||i===5,align:i===4?startAlign:center});});
    if(multi) CLS.forEach((c,k)=>{const cell=wsE.getCell(r,exClassCol(k));cell.value={formula:c.CELL(j,R_AVGPCT)};style(cell,{bold:true,numFmt:'0.0'});});
    const sums=CLS.map(c=>c.CELL(j,R_SUM)).join(',');
    const all=wsE.getCell(r,EX_ALL);
    all.value={formula:`IF(OR(SUM(${sumNs})=0,$F${r}=0),"",ROUND(SUM(${sums})/($F${r}*SUM(${sumNs}))*100,1))`};
    style(all,{bold:true,numFmt:'0.0',size:12});
    const lv=wsE.getCell(r,EX_LVL); lv.value={formula:levelOf(`${col(EX_ALL-1)}${r}`)}; style(lv,{bold:true,size:10});
    const hp=wsE.getCell(r,EX_HELP); hp.value={formula:`IF(${col(EX_ALL-1)}${r}="","",${col(EX_ALL-1)}${r}+ROW()/100000)`}; hp.font={size:8,color:{argb:'FFFFFFFF'}};
    wsE.getRow(r).height=22;
  });
  const ER=E0+Q;
  wsE.mergeCells(ER,1,ER,5); headerCell(wsE.getCell(ER,1),L.totalRow);
  const es=wsE.getCell(ER,6); es.value={formula:`SUM(F${E0}:F${ER-1})`}; style(es,{bold:true,color:'FFFFFF',bg:NAVY});
  if(multi) CLS.forEach((c,k)=>{const cell=wsE.getCell(ER,exClassCol(k));cell.value={formula:`IFERROR(ROUND(AVERAGE(${c.PCT}),1),"")`};style(cell,{bold:true,numFmt:'0.0'});});
  const ea=wsE.getCell(ER,EX_ALL); ea.value={formula:`IFERROR(ROUND(AVERAGE(${allPct}),1),"")`}; style(ea,{bold:true,numFmt:'0.0',size:12});
  const el=wsE.getCell(ER,EX_LVL); el.value={formula:levelOf(`${col(EX_ALL-1)}${ER}`)}; style(el,{bold:true,size:10});
  wsE.addConditionalFormatting({ref:`${col(EX_FIXED)}${E0}:${col(EX_LVL-1)}${ER}`,rules:cfRules(numOr(`${col(EX_FIXED)}${E0}`))});
  wsE.pageSetup={orientation:multi&&nC>3?'landscape':'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9};
  await wsE.protect('',{selectLockedCells:true,selectUnlockedCells:true,formatColumns:true});
  const EXS=q(L.shExam);
  const HELP=`${EXS}!$${col(EX_HELP-1)}$${E0}:$${col(EX_HELP-1)}$${ER-1}`;
  const QNUMS=`${EXS}!$C$${E0}:$C$${ER-1}`, TOPICS=`${EXS}!$E$${E0}:$E$${ER-1}`;

  /* ── All-classes analysis (or results summary for one class) ── */
  const SC=multi?nC:0;                 // class columns
  const cCol=(k)=>2+k;                 // 1-based: B, C, ...
  const ALLC=2+SC, BARC=ALLC+1;
  wsS.getColumn(1).width=30;
  for(let k=0;k<SC;k++) wsS.getColumn(cCol(k)).width=12;
  wsS.getColumn(ALLC).width=14; wsS.getColumn(BARC).width=28;
  wsS.mergeCells(1,1,1,BARC); wsS.getCell(1,1).value=`${SH_ALL}${info?' — '+info:''}`;
  style(wsS.getCell(1,1),{bold:true,size:15,color:'FFFFFF',bg:NAVY,border:false}); wsS.getRow(1).height=34;
  let r=3;
  const sectionTitle=(txt,bg='0F766E')=>{wsS.mergeCells(r,1,r,BARC);const c=wsS.getCell(r,1);c.value=txt;
    style(c,{bold:true,size:13,color:'FFFFFF',bg,align:{vertical:'middle',horizontal:side,indent:1}});wsS.getRow(r).height=26;r++;};
  const headRow=(first,extra=[])=>{
    headerCell(wsS.getCell(r,1),first,NAVY2);
    for(let k=0;k<SC;k++) headerCell(wsS.getCell(r,cCol(k)),classNames[k],'0F766E');
    headerCell(wsS.getCell(r,ALLC),multi?L.allClasses:L.avgPct,NAVY);
    extra.forEach(([c,t])=>headerCell(wsS.getCell(r,c),t,NAVY2));
    wsS.getRow(r).height=30; r++;
  };
  const labelCell=(row,txt,bg=GREY)=>{const c=wsS.getCell(row,1);c.value=txt;style(c,{bold:true,bg,align:startAlign});};
  const barCell=(row,ref,color='2563EB')=>{const c=wsS.getCell(row,BARC);c.value={formula:`IF(${ref}="","",REPT("█",ROUND(${ref}/4,0)))`};
    style(c,{size:10,color,align:{vertical:'middle',horizontal:side}});};

  // KPIs
  sectionTitle(L.kpi);
  headRow(L.indicator);
  const NROW=r;
  const kpis=[[L.nStudents,(p)=>`COUNT(${p})`,'0'],[L.classAvg,(p)=>`IFERROR(ROUND(AVERAGE(${p}),1),"")`,'0.0'],
    [L.median,(p)=>`IFERROR(ROUND(MEDIAN(${p}),1),"")`,'0.0'],[L.highest,(p)=>`IF(COUNT(${p})=0,"",MAX(${p}))`,'0.0'],
    [L.lowest,(p)=>`IF(COUNT(${p})=0,"",MIN(${p}))`,'0.0'],[L.stdev,(p)=>`IFERROR(ROUND(STDEV(${p}),1),"")`,'0.0']];
  kpis.forEach(([lbl,f,fmt],ki)=>{
    labelCell(r,lbl);
    for(let k=0;k<SC;k++){const c=wsS.getCell(r,cCol(k));c.value={formula:f(CLS[k].PCT)};style(c,{bold:true,numFmt:fmt});}
    const c=wsS.getCell(r,ALLC); c.value={formula:f(allPct)}; style(c,{bold:true,size:12,color:NAVY,numFmt:fmt,bg:'EEF2FF'});
    wsS.getRow(r).height=22; r++;
  });
  const AVGROW=NROW+1;
  wsS.addConditionalFormatting({ref:`${col(1)}${AVGROW}:${col(ALLC-1)}${AVGROW+3}`,rules:cfRules(numOr(`${col(1)}${AVGROW}`))});
  const NCELL=(k)=>`${col(cCol(k)-1)}$${NROW}`, NALL=`$${col(ALLC-1)}$${NROW}`;
  r++;

  // Distribution: counts
  const cnt=(P,i)=> i===0 ? `COUNTIF(${P},"<"&${BMIN(1)})`
                  : i<nb-1 ? `COUNTIFS(${P},">="&${BMIN(i)},${P},"<"&${BMIN(i+1)})`
                  : `COUNTIF(${P},">="&${BMIN(i)})`;
  sectionTitle(L.distTitle,'B45309');
  headRow(L.band,[[BARC,L.share]]);
  const D0=r;
  bands.forEach((b,i)=>{
    const lab=wsS.getCell(r,1); lab.value={formula:legendText(i)}; style(lab,{bold:true,bg:bandLight(bands,i),color:DARK});
    for(let k=0;k<SC;k++){const c=wsS.getCell(r,cCol(k));c.value={formula:cnt(CLS[k].PCT,i)};style(c,{bold:true});}
    const c=wsS.getCell(r,ALLC);
    c.value={formula:multi?`SUM(${col(1)}${r}:${col(ALLC-2)}${r})`:cnt(CLS[0].PCT,i)};
    style(c,{bold:true,size:12,color:NAVY,bg:'EEF2FF'});
    const sh=wsS.getCell(r,BARC);
    sh.value={formula:`IF(${NALL}=0,"",TEXT(${col(ALLC-1)}${r}/${NALL}*100,"0.0")&"%  "&REPT("█",ROUND(${col(ALLC-1)}${r}/${NALL}*25,0)))`};
    style(sh,{bold:true,size:10,color:traffic(bandT(bands,i),TL_TEXT),align:{vertical:'middle',horizontal:side}});
    wsS.getRow(r).height=22; r++;
  });
  labelCell(r,L.totalRow,'E2E8F0');
  for(let k=0;k<=SC;k++){const cc=k<SC?cCol(k):ALLC;const c=wsS.getCell(r,cc);c.value={formula:`SUM(${col(cc-1)}${D0}:${col(cc-1)}${r-1})`};style(c,{bold:true,bg:'E2E8F0'});}
  style(wsS.getCell(r,BARC),{bg:'E2E8F0'});
  r+=2;

  // Distribution: percentages per class
  if(multi){
    sectionTitle(L.distPctTitle,'B45309');
    headRow(L.band);
    bands.forEach((b,i)=>{
      const lab=wsS.getCell(r,1); lab.value={formula:legendText(i)}; style(lab,{bold:true,bg:bandLight(bands,i),color:DARK});
      for(let k=0;k<=SC;k++){
        const cc=k<SC?cCol(k):ALLC, nref=k<SC?NCELL(k):NALL;
        const c=wsS.getCell(r,cc);
        c.value={formula:`IF(${nref}=0,"",ROUND(${col(cc-1)}${D0+i}/${nref}*100,1))`};
        style(c,{bold:true,numFmt:'0.0',bg:k<SC?null:'EEF2FF'});
      }
      wsS.getRow(r).height=22; r++;
    });
    r++;
  }

  // Group tables (Bloom / Section / Topic)
  const groupTable=(title,bg,rowIdx,key,label)=>{
    const seen=[];questions.forEach(qq=>{const v=String(qq[key]||'').trim();if(v&&!seen.includes(v))seen.push(v);});
    if(!seen.length) return;
    sectionTitle(title,bg);
    headRow(label,[[BARC,L.chart]]);
    const g0=r;
    const META=CLS[0];
    seen.forEach(v=>{
      labelCell(r,v,key==='bloomSkill'?bloomFill(v):GREY);
      const mx=`SUMIF(${META.ROW(rowIdx)},$A${r},${META.ROW(R_MX)})`;
      const got=(c)=>`SUMIF(${c.ROW(rowIdx)},$A${r},${c.ROW(R_SUM)})`;
      for(let k=0;k<SC;k++){
        const c=wsS.getCell(r,cCol(k));
        c.value={formula:`IF(OR(${CLS[k].N}=0,${mx}=0),"",ROUND(${got(CLS[k])}/(${mx}*${CLS[k].N})*100,1))`};
        style(c,{bold:true,numFmt:'0.0'});
      }
      const c=wsS.getCell(r,ALLC);
      c.value={formula:`IF(OR(SUM(${sumNs})=0,${mx}=0),"",ROUND((${CLS.map(got).join('+')})/(${mx}*SUM(${sumNs}))*100,1))`};
      style(c,{bold:true,size:12,numFmt:'0.0'});
      barCell(r,`${col(ALLC-1)}${r}`);
      wsS.getRow(r).height=key==='contentSkill'?30:22; r++;
    });
    wsS.addConditionalFormatting({ref:`${col(1)}${g0}:${col(ALLC-1)}${r-1}`,rules:cfRules(numOr(`${col(1)}${g0}`))});
    r++;
  };
  groupTable(L.byBloom,'7C3AED',R_BL,'bloomSkill',L.bloom);
  groupTable(L.bySection,'1D4ED8',R_SEC,'section',L.section);
  groupTable(L.byTopic,'0F766E',R_TP,'contentSkill',L.topic);

  // Weakest / strongest (all classes)
  const k3=Math.min(3,Q);
  [[L.weakest,'SMALL','B91C1C'],[L.strongest,'LARGE','15803D']].forEach(([title,fn,bg])=>{
    sectionTitle(title,bg);
    headerCell(wsS.getCell(r,1),L.question,NAVY2);
    if(ALLC-1>2) wsS.mergeCells(r,2,r,ALLC-1);
    headerCell(wsS.getCell(r,2),L.topic,NAVY2);
    headerCell(wsS.getCell(r,ALLC===2?BARC:ALLC),L.avgPct,NAVY2);
    wsS.getRow(r).height=24; r++;
    const vcol=ALLC===2?BARC:ALLC;
    const first=r;
    for(let k=1;k<=k3;k++){
      const key=`${fn}(${HELP},${k})`, pos=`MATCH(${key},${HELP},0)`;
      const c1=wsS.getCell(r,1); c1.value={formula:`IFERROR(INDEX(${QNUMS},${pos})&"","")`}; style(c1,{bold:true,bg:GREY});
      if(ALLC-1>2) wsS.mergeCells(r,2,r,ALLC-1);
      const c2=wsS.getCell(r,2); c2.value={formula:`IFERROR(INDEX(${TOPICS},${pos})&"","")`}; style(c2,{align:startAlign});
      const c3=wsS.getCell(r,vcol); c3.value={formula:`IFERROR(ROUND(${key},1),"")`}; style(c3,{bold:true,numFmt:'0.0'});
      wsS.getRow(r).height=24; r++;
    }
    const vl=col(vcol-1);
    wsS.addConditionalFormatting({ref:`${vl}${first}:${vl}${r-1}`,rules:cfRules(numOr(`${vl}${first}`))});
    r++;
  });
  wsS.pageSetup={orientation:nC>3?'landscape':'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9};
  await wsS.protect('',{selectLockedCells:true,selectUnlockedCells:true,formatColumns:true});

  /* ── Guide sheet ── */
  wsGuide.columns=[{width:12},{width:95}];
  wsGuide.pageSetup={orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9};
  /* brand banner: logo + "class screening with the Smart Sparks platform" */
  ['A1','B1'].forEach(a=>style(wsGuide.getCell(a),{bg:'0B1638',border:false}));
  wsGuide.getRow(1).height=66;
  const bc=wsGuide.getCell('B1'); bc.value=(typeof GUIDE_BRAND!=='undefined'?(GUIDE_BRAND[lang]||GUIDE_BRAND.ar):'');
  style(bc,{bold:true,size:15,color:'E9C46A',bg:'0B1638',border:false,align:{vertical:'middle',horizontal:side}});
  try{ const imgId=wb.addImage({base64:LOGO_FILE_B64,extension:'jpeg'}); wsGuide.addImage(imgId,{tl:{col:0.12,row:0.06},ext:{width:72,height:62},editAs:'oneCell'}); }catch(e){}
  wsGuide.mergeCells('A2:B2'); wsGuide.getCell('A2').value=L.title+(info?' — '+info:'');
  style(wsGuide.getCell('A2'),{bold:true,size:16,color:'FFFFFF',bg:NAVY,border:false}); wsGuide.getRow(2).height=36;
  L.guide.forEach(([a,b],i)=>{
    const rr=4+i;
    if(i===0){wsGuide.mergeCells(rr,1,rr,2);const c=wsGuide.getCell(rr,1);c.value=a;
      style(c,{bold:true,size:13,color:NAVY,border:false,align:{vertical:'middle',horizontal:side}});wsGuide.getRow(rr).height=26;return;}
    const ca=wsGuide.getCell(rr,1), cb=wsGuide.getCell(rr,2);
    ca.value=a; style(ca,{bold:true,color:'FFFFFF',bg:i===L.guide.length-1?'64748B':'EA580C'});
    cb.value=b.replace('%ALL%',SH_ALL); style(cb,{bg:i%2?'FFFFFF':ZEBRA,align:startAlign});
    wsGuide.getRow(rr).height=30;
  });
  let lg=5+L.guide.length;
  wsGuide.getCell(lg,1).value=`${L.classLbl}:`; style(wsGuide.getCell(lg,1),{bold:true,border:false});
  wsGuide.getCell(lg,2).value=classNames.join('   •   '); style(wsGuide.getCell(lg,2),{bold:true,color:NAVY,border:false,align:startAlign});
  lg+=2;
  wsGuide.getCell(lg,1).value=L.legend; style(wsGuide.getCell(lg,1),{bold:true,border:false});
  bands.forEach((b,i)=>{
    const rr=lg+1+i;
    style(wsGuide.getCell(rr,1),{bg:bandLight(bands,i)});

    style(d,{bold:true,color:DARK,align:startAlign});
    wsGuide.getRow(rr).height=22;
  });

  /* ── meta (lets the platform read the file back reliably) ── */
  wsM.getCell('A1').value=JSON.stringify({app:'mapping_with_muna',v:3,lang,classes:classNames,firstRow:R1,lastRow:RN,firstQCol:FQ+1,qCount:Q,
    bandsSheet:L.shBands,bandsFirstRow:B0,bandCount:nb,maxRow:R_MX,secRow:R_SEC,qnRow:R_QN,blRow:R_BL,tpRow:R_TP});

  wb.views=[{activeTab:1,firstSheet:0,visibility:'visible'}];
  addBrandFooter(wb,lang);
  wb.calcProperties={...(wb.calcProperties||{}),fullCalcOnLoad:true};   // Excel recalculates every formula on open
  return wb;
}

/* ═══════════ READ A FILLED WORKBOOK BACK ═══════════ */
function cellNum(v){
  if(v===null||v===undefined||v==='') return null;
  if(typeof v==='object'){ if('result' in v) v=v.result; else if(v.richText) v=v.richText.map(x=>x.text).join(''); else return null; }
  const n=typeof v==='number'?v:parseFloat(String(v).replace(',','.'));
  return isNaN(n)?null:n;
}
function cellText(v){
  if(v===null||v===undefined) return '';
  if(typeof v==='object'){ if('result' in v) return String(v.result??''); if(v.richText) return v.richText.map(x=>x.text).join(''); if(v.text) return String(v.text); }
  return String(v);
}
async function readScreeningWorkbook(ExcelJS,arrayBuffer){
  const wb=new ExcelJS.Workbook();
  await wb.xlsx.load(arrayBuffer);
  const meta=wb.getWorksheet('_meta');
  if(!meta) throw new Error('nometa');
  const M=JSON.parse(cellText(meta.getCell('A1').value));
  const classList=M.classes||[M.gradesSheet];
  /* class names come from the real sheet names: a sheet the teacher renamed (e.g. "ז1" → "ז A")
     or added by copying is still read, as long as it has the same question header rows */
  const reserved=new Set(['_meta',M.bandsSheet]);
  Object.values(XL).forEach(L=>[L.shGuide,L.shExam,L.shSummary,L.shAll,L.shBands].forEach(x=>reserved.add(x)));
  const known=new Set(classList);
  const numAt=(ws,r,c)=>{const v=ws.getCell(r,c).value;const x=typeof v==='object'&&v?(v.result??v):v;return x!==null&&x!==''&&!isNaN(Number(x));};
  const looksLikeClass=(ws)=>{
    if(!M.maxRow||!M.firstQCol||!M.qCount) return false;
    for(let j=0;j<M.qCount;j++){ if(!numAt(ws,M.maxRow,M.firstQCol+j)) return false; }
    return true;
  };
  const sheets=wb.worksheets
    .filter(ws=>ws.state!=='veryHidden'&&ws.state!=='hidden'&&!reserved.has(ws.name)&&(known.has(ws.name)||looksLikeClass(ws)))
    .map(ws=>({name:ws.name,ws}));
  if(!sheets.length) throw new Error('nosheets');
  const wsB=wb.getWorksheet(M.bandsSheet);
  let bands=null;
  if(wsB){
    const b=[];
    for(let i=0;i<M.bandCount;i++){
      const r=M.bandsFirstRow+i;
      b.push({name:cellText(wsB.getCell(r,2).value).trim(),min:cellNum(wsB.getCell(r,3).value)});
    }
    b.forEach((x,i)=>{const v=cellNum(wsB.getCell(M.bandsFirstRow+i,4).value);if(v!==null)x.max=v;});
    const nb2=normalizeBands(b);
    if(!validateBands(nb2)) bands=nb2;
  }
  const ws0=sheets[0].ws;
  const questions=[];
  for(let j=0;j<M.qCount;j++){
    const C=M.firstQCol+j;
    questions.push({section:cellText(ws0.getCell(M.secRow,C).value),qNum:cellText(ws0.getCell(M.qnRow,C).value),bloomSkill:cellText(ws0.getCell(M.blRow,C).value),
      contentSkill:cellText(ws0.getCell(M.tpRow,C).value),max:cellNum(ws0.getCell(M.maxRow,C).value)||0});
  }
  const totalMax=questions.reduce((a,q)=>a+q.max,0);
  const students=[];
  sheets.forEach(({name,ws})=>{
    for(let r=M.firstRow;r<=M.lastRow;r++){
      const vals=questions.map((q,j)=>cellNum(ws.getCell(r,M.firstQCol+j).value));
      if(vals.every(v=>v===null)) continue;
      const nm=cellText(ws.getCell(r,2).value).trim()||`#${r-M.firstRow+1}`;
      const pts=vals.map((v,j)=>Math.min(Math.max(v||0,0),questions[j].max));
      const total=pts.reduce((a,b)=>a+b,0);
      students.push({name:nm,cls:name,pts,total,pct:totalMax?Math.round(total/totalMax*1000)/10:0});
    }
  });
  return {questions,students,bands,totalMax,lang:M.lang,classes:sheets.map(s=>s.name)};
}

/* analytics from a read workbook */
function analyticsFromWorkbook(res,bands){
  const {questions,students}=res;
  const classes=res.classes||[];
  const n=students.length;
  const scores=students.map(s=>s.pct);
  const qAvg=(list,j)=>list.length&&questions[j].max?Math.round(list.reduce((a,s)=>a+s.pts[j],0)/(questions[j].max*list.length)*1000)/10:0;
  const perQuestion=questions.map((q,j)=>({...q,avgPct:qAvg(students,j),byClass:classes.map(c=>qAvg(students.filter(s=>s.cls===c),j))}));
  const group=(key)=>{
    const m={};
    questions.forEach((q,j)=>{const k=String(q[key]||'').trim();if(!k)return;(m[k]=m[k]||{name:k,max:0,got:0,count:0});m[k].max+=q.max;m[k].count++;m[k].got+=students.reduce((a,s)=>a+s.pts[j],0);});
    return Object.values(m).map(g=>({name:g.name,count:g.count,avgPct:n&&g.max?Math.round(g.got/(g.max*n)*1000)/10:0}));
  };
  const classStats=classes.map(c=>{
    const sc=students.filter(s=>s.cls===c).map(s=>s.pct);
    return {name:c,n:sc.length,average:sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length*10)/10:0,counts:buildDist(sc,bands)};
  });
  return {
    scores, counts:buildDist(scores,bands), bands:bands.map(b=>({...b})), fileLang:res.lang,
    totalStudents:n, average:n?scores.reduce((a,b)=>a+b,0)/n:0,
    students:students.map(s=>({name:s.name,cls:s.cls,pct:s.pct,total:s.total})),
    classes:classStats,
    perQuestion, byBloom:group('bloomSkill'), bySection:group('section')
  };
}

/* old drafts stored distribution as fixed keys — rebuild counts with the current ranges */
function normalizeAnalytics(a,bands){
  if(!a) return a;
  const ab=normalizeBands(a.bands);
  const b=(ab&&!validateBands(ab))?ab:bands;
  return {...a,bands:b,counts:buildDist(a.scores||[],b)};
}
/* split ranges into the three intervention groups used by the plan */
function planGroups(bands){
  const n=bands.length;
  return {intensive:[0],strategic:Array.from({length:n-2},(_,i)=>i+1),enrich:[n-1]};
}

const BandEditor=({bands,setBands,lang,t})=>{
  const err=validateBands(bands);
  const gaps=err?[]:bandGaps(bands);
  const n=bands.length;
  const [flash,setFlash]=useState(null);   // the bound that was just guessed automatically, e.g. "min-2"
  const setCount=(k)=>setBands(presetBands(lang,k));
  const num=(v)=>v===''?'':Number(v);
  const setName=(i,v)=>setBands(bands.map((b,j)=>j===i?{...b,name:v}:b));
  /* editing an upper bound suggests the next lower bound, and vice versa */
  const setBound=(i,key,v)=>{
    const val=num(v);
    const next=bands.map(b=>({...b}));
    next[i][key]=val;
    let guessed=null;
    if(val!==''&&!isNaN(val)){
      if(key==='max'&&i<n-1){next[i+1].min=roundB(val+boundStep(val));guessed=`min-${i+1}`;}
      if(key==='min'&&i>0){next[i-1].max=roundB(val-boundStep(val));guessed=`max-${i-1}`;}
    }
    setBands(next);
    if(guessed){setFlash(guessed);setTimeout(()=>setFlash(f=>f===guessed?null:f),1400);}
  };
  const inp={padding:'8px 10px',borderRadius:'10px',border:'2px solid #e5e7eb',outline:'none',fontSize:'.95rem',fontFamily:"'Cairo',sans-serif",width:'100%',transition:'background .4s, border-color .4s'};
  const boundStyle=(id)=>({...inp,textAlign:'center',fontWeight:700,
    ...(flash===id?{background:'#dcfce7',borderColor:'#22c55e'}:{background:'white'})});
  const cols='16px 1fr 88px 14px 88px';
  return(
    <div className="p-5 rounded-2xl border-2 border-indigo-100 bg-indigo-50/40 fade-in">
      <h3 style={{fontSize:'1.15rem',fontWeight:800,color:'#1e3a5f',marginBottom:'4px'}}>🎯 {t.bandsTitle}</h3>
      <p style={{fontSize:'.88rem',color:'#475569',marginBottom:'14px'}}>{t.bandsSub}</p>
      <div style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap:'10px',marginBottom:'14px'}}>
        <span style={{fontWeight:700,color:'#374151'}}>{t.bandsCount}:</span>
        {[4,5,6].map(k=>(
          <button key={k} onClick={()=>setCount(k)} style={{width:'44px',height:'40px',borderRadius:'12px',fontWeight:800,cursor:'pointer',
            border:'2px solid '+(n===k?'#4f46e5':'#e5e7eb'),background:n===k?'#4f46e5':'white',color:n===k?'white':'#374151'}}>{k}</button>
        ))}
        <button onClick={()=>setCount(n)} style={{marginInlineStart:'auto',fontSize:'.8rem',color:'#4f46e5',background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}>{t.bandReset}</button>
      </div>
      <div style={{display:'grid',gap:'8px'}}>
        <div style={{display:'grid',gridTemplateColumns:cols,gap:'8px',fontSize:'.78rem',fontWeight:700,color:'#64748b',textAlign:'center'}}>
          <span/><span style={{textAlign:'start'}}>{t.bandName}</span><span>{t.bandFrom}</span><span/><span>{t.bandUpTo}</span>
        </div>
        {bands.map((b,i)=>(
          <div key={i} style={{display:'grid',gridTemplateColumns:cols,gap:'8px',alignItems:'center'}}>
            <span style={{width:'16px',height:'16px',borderRadius:'4px',background:'#'+bandLight(bands,i),border:'1px solid rgba(0,0,0,.12)'}}/>
            <input value={b.name} onChange={e=>setName(i,e.target.value)} style={inp}/>
            <input type="number" min="0" max="100" step="any" value={b.min} onChange={e=>setBound(i,'min',e.target.value)} style={boundStyle(`min-${i}`)} aria-label={`${b.name} ${t.bandFrom}`}/>
            <span style={{textAlign:'center',color:'#94a3b8',fontWeight:700}}>–</span>
            <input type="number" min="0" max="100" step="any" value={b.max===undefined?bandUpper(bands,i):b.max} onChange={e=>setBound(i,'max',e.target.value)} style={boundStyle(`max-${i}`)} aria-label={`${b.name} ${t.bandUpTo}`}/>
          </div>
        ))}
      </div>
      <p style={{fontSize:'.78rem',color:'#6366f1',marginTop:'10px'}}>ℹ️ {t.bandClampNote}</p>
      {gaps.map(i=><div key={i} style={{marginTop:'6px',color:'#b45309',fontWeight:700,fontSize:'.85rem'}}>⚠️ {t.bandGapWarn.split('%1').join(bands[i].name).replace('%2',bands[i+1].name)}</div>)}
      {err&&<div style={{marginTop:'8px',color:'#b91c1c',fontWeight:700,fontSize:'.88rem'}}>⚠️ {t.bandErr[err]}</div>}
    </div>
  );
};

function validateClasses(classes){
  if(!classes.length||classes.some(c=>!String(c||'').trim())) return 'classErrEmpty';
  const low=classes.map(c=>String(c).trim().toLowerCase());
  if(new Set(low).size!==low.length) return 'classErrDup';
  return null;
}

async function exportBandLists({analytics,t,lang,teacher}){
  const bands=analytics.bands, L=XL[lang]||XL.ar;
  const wb=new ExcelJS.Workbook();
  const rows=analytics.students||analytics.scores.map((s,i)=>({name:`#${i+1}`,pct:s}));
  const multi=(analytics.classes||[]).length>1;
  const heads=multi?['#',t.student,t.clsCol,t.pctCol]:['#',t.student,t.pctCol];
  const names=sheetSafeNames(bands.map(b=>b.name),[]);
  bands.forEach((b,i)=>{
    const ws=wb.addWorksheet(names[i],{views:[{rightToLeft:L.rtl,showGridLines:false}],properties:{tabColor:{argb:'FF'+bandLight(bands,i)}}});
    ws.columns=multi?[{width:6},{width:30},{width:16},{width:14}]:[{width:6},{width:30},{width:14}];
    const last=String.fromCharCode(64+heads.length);
    ws.mergeCells(`A1:${last}1`);
    ws.getCell('A1').value=`${b.name} (${bandRangeLabel(bands,i)})${teacher.grade?' — '+teacher.grade:''}`;
    ws.getCell('A1').font={name:'Arial',bold:true,size:14,color:{argb:'FF111827'}};
    ws.getCell('A1').fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+bandLight(bands,i)}};
    ws.getCell('A1').alignment={horizontal:'center',vertical:'middle'}; ws.getRow(1).height=30;
    heads.forEach((h,k)=>{const c=ws.getCell(3,k+1);c.value=h;c.font={name:'Arial',bold:true,color:{argb:'FFFFFFFF'}};
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1E3A5F'}};c.alignment={horizontal:'center'};});
    rows.filter(s=>bandIndex(s.pct,bands)===i)
      .sort((a,b)=>multi&&a.cls!==b.cls?String(a.cls).localeCompare(String(b.cls)):a.pct-b.pct)
      .forEach((s,k)=>{
        const r=4+k, vals=multi?[k+1,s.name,s.cls||'',s.pct]:[k+1,s.name,s.pct];
        vals.forEach((v,m)=>{const c=ws.getCell(r,m+1);c.value=v;c.font={name:'Arial'};
          c.alignment={horizontal:m===1?(L.rtl?'right':'left'):'center'};
          c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+(k%2?'F8FAFC':'FFFFFF')}};
          c.border={bottom:{style:'thin',color:{argb:'FFE5E7EB'}}};});
      });
  });
  addBrandFooter(wb,lang);
  await downloadWorkbook(wb,`groups_${teacher.grade||'class'}.xlsx`);
}
async function downloadWorkbook(wb,filename){
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* reads Claude's reply: a ```json block (or any {"questions":[...]} object) */
function parseExamJSON(text){
  if(!text) return null;
  const tryParse=(str)=>{try{return JSON.parse(str);}catch{return null;}};
  let obj=null;
  const fence=text.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(fence) obj=tryParse(fence[1].trim());
  if(!obj){const i=text.indexOf('{'),j=text.lastIndexOf('}');if(i>=0&&j>i) obj=tryParse(text.slice(i,j+1));}
  if(!obj){const i=text.indexOf('['),j=text.lastIndexOf(']');if(i>=0&&j>i){const a=tryParse(text.slice(i,j+1));if(Array.isArray(a))obj={questions:a};}}
  const arr=obj&&(Array.isArray(obj)?obj:obj.questions);
  if(!Array.isArray(arr)) return null;
  const data=arr.map((q,k)=>({
    section:String(q.section??q.part??'').trim(),
    qNum:String(q.q??q.qNum??q.number??k+1).trim(),
    bloomSkill:String(q.bloom??q.bloomSkill??'').trim(),
    contentSkill:String(q.topic??q.contentSkill??q.skill??'').trim(),
    max:parseFloat(String(q.max??q.score??'').replace(',','.'))
  })).filter(q=>!isNaN(q.max)&&q.max>0);
  return data.length?data:null;
}
function parseExamReply(text){return parseExamJSON(text)||parseMD(text);}

/* grade level from a class sheet name: "ז1","ז A","ז-2","ח'3","سابع أ","7B" → "ז","ז","ז","ח","سابع","7" */
function gradeOfClass(name){
  const m=String(name||'').trim();
  let k=m.replace(/[\s\-_.\/]*\d+$/,'');
  if(k===m) k=m.replace(/[\s\-_.\/]*[A-Za-z]$/,'');
  if(k===m) k=m.replace(/[\s\-_.\/]+[֐-׿؀-ۿ]['׳]?$/,'');
  k=k.replace(/['"׳״]/g,'').trim();
  return k||m;
}
function groupClassesByGrade(names){
  const g=[];
  names.forEach(n=>{const k=gradeOfClass(n);let e=g.find(x=>x.grade===k);if(!e){e={grade:k,classes:[]};g.push(e);}e.classes.push(n);});
  return g;
}

function buildClaudeReportPrompt({analytics,subject,teacher}){
  const S=REPORT_SUBJECTS[subject]||REPORT_SUBJECTS.arabic;
  const AR=S.out==='ar', OUT=AR?'Arabic':'Hebrew';
  const B=analytics.bands||[], nb=B.length, n=analytics.totalStudents||0;
  const nm=(i)=>`"${B[i].name}" (${bandRangeLabel(B,i)})`;
  const low=nm(0), low2=nb>1?nm(1):low, top=nm(nb-1);
  const U=S.topicUnit?'topic':'skill', Us=S.topicUnit?'topics':'skills';
  const classes=(analytics.classes||[]).map(c=>c.name).filter(Boolean);
  const groups=groupClassesByGrade(classes);
  const multi=groups.length>1;
  const XLs=XL[analytics.fileLang]||XL.ar;
  const ignore=[XLs.shGuide,XLs.shAll,XLs.shSummary,XLs.shExam].map(s=>`"${s}"`).join(', ');
  const bandsSheet=`"${XLs.shBands}"`;
  const pct=(c)=>n?(c/n*100).toFixed(1):'0';
  const bandLines=B.map((b,i)=>`   • ${nm(i)}`).join('\n');
  const colorLines=B.map((b,i)=>`   - ${nm(i)}: #${bandLight(B,i)}`).join('\n');
  const classList=classes.length?classes.map(c=>`"${c}"`).join(', '):'(every sheet that contains student rows)';
  const gradeLines=groups.map(g=>`   • Grade "${g.grade}": ${g.classes.map(c=>`"${c}"`).join(', ')}`).join('\n');
  const refDist=B.map((b,i)=>`${b.name}: ${analytics.counts[i]} (${pct(analytics.counts[i])}%)`).join(', ');
  const refCls=(analytics.classes||[]).map(c=>`   - "${c.name}": n=${c.n}, average ${c.average} | `+B.map((b,i)=>`${b.name}: ${c.counts[i]}`).join(', ')).join('\n');
  const refBloom=(analytics.byBloom||[]).map(g=>`${g.name}: ${g.avgPct}%`).join(', ');
  const meta=[teacher&&teacher.name&&`teacher: ${teacher.name}`,teacher&&teacher.grade&&`grade: ${teacher.grade}`,teacher&&teacher.date&&`date: ${teacher.date}`].filter(Boolean).join(', ');
  const skillNote=S.skillNote||'';

  return `You are ${S.expert}.

⚠️ Important before you start:
Carry out everything directly, without asking any question, requesting clarification or waiting for approval. If anything in the data, the classification of questions or the grade grouping is ambiguous, make the most pedagogically appropriate decision yourself, record your assumptions in a sheet named "${S.notes}" in the Excel file, and complete the analysis to the end. (The only exception: if no Excel file is attached to this message, write one line asking for it and stop.)

Attached is an Excel file with the results of a class screening (مسح صفي / מבדק כיתתי) in ${S.subj}${meta?` (${meta})`:''}.

Output language:
${S.langRules}

${RULE}
0. File structure, classes and grade levels
${RULE}
- The file was produced by the class-screening platform. Its sheets are:
  • Class sheets – one sheet per class; the sheet name IS the class name. The class sheets in this file are: ${classList}. Use these names exactly as written (they may be a letter and a number like "ז1", a letter and a Latin letter like "ז A", or any other form). At the top of each class sheet there are header rows giving, for every question: section, question number, Bloom level, question topic and maximum score. Below them there is one row per student (with the name) and the student's score in each question, followed by total, percentage and range.
  • The ${bandsSheet} sheet: the score ranges (المجالات) the teacher chose for the distribution (name, from, to). Use these ranges exactly throughout the analysis, instead of any fixed score groups.
  • The ${ignore} sheets: instructions and automatic calculations. Do not treat them as classes; use them only to cross-check.
  • Ignore hidden sheets.
- A student whose row is completely empty was absent: do not count them.

Grade levels: the classes are grouped into grade levels by the grade part of the sheet name (e.g. "ז A", "ז B" and "ז1" all belong to grade ז; ז = 7th, ח = 8th, ט = 9th). Grouping detected from the sheet names:
${gradeLines||'   • (determine the grouping from the sheet names)'}
Verify this grouping against the sheet contents (titles, question structure); if it is wrong, correct it and record the correction in "${S.notes}".
${multi?`- This file contains ${groups.length} grade levels. Run the FULL analysis below separately for each grade level (its own classes, skills, distribution, support lists and charts), and then add a comparison between the grade levels (section B.6).`:'- This file contains one grade level. Run the analysis for it and compare its classes. Skip the between-grades comparison.'}
- Classes of the same grade have the same structure and question order, so compare the same question and the same ${U} directly between them.
- Do not compare different grades question by question unless the screenings are actually identical. Compare grades on averages, range distribution and shared ${Us} only, and state that different screenings limit the comparison.

Score ranges chosen by the teacher (from the ${bandsSheet} sheet):
${bandLines}
A score between two ranges counts in the lower range; a score below the first range counts in it, and above the last range in the last. If the ${bandsSheet} sheet in the file shows different values, use the file's values and record this in "${S.notes}".

${RULE}
${S.skillsTitle}
${RULE}
1) Every question in the file already has a Bloom level and a topic (in the header rows of the class sheets). Keep them as they are and base the classification on them.

${S.skills}

${RULE}
B. Required analysis (for each grade level separately)
${RULE}
1) Student scores and averages:
   - Calculate each student's total score as a percentage (out of 100).
   - Calculate the average of each class and of each grade level, with the highest score, lowest score and standard deviation for each class.

2) ${S.analysisTitle||'Skills analysis'}:
${S.analysisCalc||'   - Calculate the success rate in every main skill and sub-skill, in every class and for the whole grade.\n   - Classify the skills:'}
     • Low achievement – needs a support plan: below 55%.
     • Medium achievement – needs follow-up: 55%–75%.
     • Mastery – needs reinforcement and maintenance: above 75%.${S.calcExtra||''}
   - Also calculate the success rate for each Bloom level as it appears in the file.
   - Identify the hardest and easiest questions (lowest and highest success rate)${S.causeEx||', and explain pedagogically the likely cause of difficulty.'}
${S.skillExtra}

3) Distribution of students across the ranges, in each class:
   - Count the students in each of the ${nb} ranges above, with the percentage of each range, in each class and for the whole grade.
   - Make sure the range counts add up to the number of students in the class.

4) Named lists of students who need support to close gaps:
   - For each class, list the students recommended for support:
     • Students in the range ${low} (top priority).
${nb>1?`     • Students in the range ${low2} (support and follow-up).\n`:''}     • Students whose score is one standard deviation or more below their class average, even if they are in a higher range.
     • Students whose total is acceptable but who have a clear weakness in a specific ${U} (below 55% in it).
   - For each student give: name, grade, class, total score, range, gap from the class average, the ${Us} needing support, and priority level (high / medium).
   - Build a table for every low-achievement ${U} with the names of the students who are weak in it, to form support groups by ${U}.
   - List the excelling students (range ${top}) for enrichment or as peer tutors.

5) Comparison between the classes of the grade:
   - Compare the classes of the grade by average, range distribution and success rate in every ${U} and every question.
   - Highlight notable differences (a ${U} weak in only one class, or weak in all classes of the grade).
   - Create charts: columns for class averages, clustered columns for ${U} success rates by class, and a chart of the range distribution.

6) Comparison between grade levels (${multi?'REQUIRED – this file contains more than one grade level':'only if the file contains more than one grade level'}):
   - Compare the grade levels by averages, range distribution and success rates in the shared ${Us}.
   - Point out ${Us} that stay weak across grades${S.gapEx||' (cumulative gap)'}, or ${Us} that improve as the grades advance.
   - Create comparison charts between the grade levels, and state the limits of the comparison if the screenings differ.

7) Insights and recommendations:
   - Extract the main insights for every class and every grade level.
   - Write practical recommendations suited to each grade level and to teaching ${S.subj}: ${S.recos}; for students in the range ${low} ${S.lowTreat||'(a remedial plan)'}; for excelling students ${S.topEnrich||'(enrichment and peer tutoring)'}; ${S.team} (if the file covers more than one grade); and for the school management and parents.

${RULE}
C. Use of colour
${RULE}
Use the same range colours as the platform's Excel file (a traffic-light scale from red for the lowest range to green for the highest), consistently in both files:
${colorLines}
   - Low-achievement ${Us} (below 55%) and high-priority students: the colour of the lowest range. Medium ${Us}: yellow/orange. Mastered ${Us} (above 75%) and excelling students: the colour of the highest range.
   - In the Excel file use Conditional Formatting so the colours update automatically.
   - Add a clear colour legend on every Excel sheet and at the start of the Word file.
   - Do not overuse colour: use it only where it helps read the results quickly.

${RULE}
D. Required outputs
${RULE}
1) Excel file (.xlsx) – the full, detailed analysis, in ${OUT}${skillNote}, sheets right-to-left:
   All the calculations, tables, lists and charts above, without shortening. Sheets:
   1. "${S.notes}" (notes and assumptions).
   2. ${S.sheet2||'mapping of questions to skills (per grade)'}.
   3. one sheet per class (student scores, averages and range distribution), named exactly like the class.
   4. ${S.sheet4||'skills analysis (per class and per grade), hardest and easiest questions'}.
   5. "${S.support}" (priority lists, students by ${U}, excelling students).
   6. comparison between the classes of each grade, with charts.
   7. comparison between grade levels${multi?'':' (only if the file has more than one grade)'}.
   8. detailed insights and recommendations.

2) Word file (.docx) – a short summary report (דוח מסכם), in ${OUT}${skillNote}:
   The Word file is NOT a copy of the full analysis; it is a short, easy-to-read summary. The full detail lives only in the Excel file.

   Brevity rules:
   - Start directly with the findings. No introduction, theoretical background or methodology, and do NOT propose a plan or structure for a next exam or a re-assessment exam.
   - Do not copy the detailed Excel tables into Word (no student scores, no question-by-question analysis, no question-mapping tables).
   - Insert in Word the same charts as in the Excel file (same data, chart type and colours), as clear images.
   - Under every chart or summary table add a short box titled (in Hebrew, exactly as written):
     ${REPORT_INSIGHTS}
     with 3–4 short bullet points only (one or two lines each), in ${OUT}: what the chart shows and the practical recommendation that follows.
   - Write directly and concisely, without repetition.
   - At most 2–3 pages per class, plus a cover page and a one-page overall summary.

   Word structure:
   1. Cover page: the title "${S.title} – [grade level(s)]", the classes included (with their names from the file), and the date. Under them, one small, light-grey line (10 pt, centred): "${AR?'أُعدّ بمساعدة منصة ومضات ذكية – منى مصطفى':'הוכן בעזרת פלטפורמת ברקים חכמים – מונא מוסטפא'}", with the platform logo small above it (about 2 cm; logo at ${LOGO} – if you cannot download it, use the text only and do not stop or mention it).
   2. Overall summary, one page: the 5 most important findings, and the colour legend (the ranges and their colours).
   3. ${multi?'For each grade level, in order: (a) for each class of that grade':'For each class, in order'}:
      a. A small table of key figures: number of students, class average, and the number of students in each of the ${nb} ranges.
      b. Range-distribution chart → "${REPORT_INSIGHTS}" box.
      c. ${S.skillChart||`chart of success rates by ${U}`} → "${REPORT_INSIGHTS}" box.
      d. ${S.skillTable||`short table of low-achievement ${Us} that need a support plan and mastered ${Us} that need reinforcement`} → "${REPORT_INSIGHTS}" box.
      e. Names of high-priority students only, in one line or a small table, noting that the full lists are in the "${S.support}" sheet of the Excel file.
${multi?'      (b) then the comparison between the classes of that grade: comparison charts → a "'+REPORT_INSIGHTS+'" box for each chart.\n   4. Comparison between the grade levels: comparison charts → a "'+REPORT_INSIGHTS+'" box for each chart.':'   4. Comparison between the classes (if there is more than one class): comparison charts → a "'+REPORT_INSIGHTS+'" box for each chart.'}
   5. General summary and recommendations: one page at most, in bullet points.

   Word formatting:
   - Page and text direction right-to-left (RTL), clear professional ${AR?'Modern Standard Arabic':'standard Hebrew'}.
   - A clear ${AR?'Arabic font (e.g. Arial or Simplified Arabic)':'Hebrew font (e.g. David, Arial or Calibri)'} at a size comfortable for reading and printing.
   - "${REPORT_INSIGHTS}" boxes highlighted with a border or light shading.
   - The few tables small, neat and coloured according to the legend.
   - Page numbers.
   - A subtle footer on EVERY page without exception: small (8–9 pt), light-grey text, not bold, centred, containing exactly the platform name:
     ${brandOf(S.out)}
     Put the platform logo very small (about 0.8 cm high) next to the name. The logo is at ${LOGO} ; if you cannot download it, use the text only and do not stop or mention it.
   - Ready to print and send.

${RULE}
E. Cross-check: figures the platform calculated from the same file
${RULE}
- Students: ${n}, overall average: ${(analytics.average||0).toFixed(1)}
- Range distribution: ${refDist}
${refCls}${refBloom?`\n- Achievement by Bloom level: ${refBloom}`:''}
Your calculations must match these figures. If they differ, rely on the file and explain why in "${S.notes}".

/* ═══════════ TEACHER COMPASS (short, data-driven guidance) ═══════════ */
function topicStats(analytics){
  const m={};
  (analytics.perQuestion||[]).forEach(q=>{
    const k=String(q.contentSkill||'').trim(); if(!k||!q.max) return;
    (m[k]=m[k]||{name:k,max:0,got:0}); m[k].max+=q.max; m[k].got+=q.avgPct*q.max/100;
  });
  return Object.values(m).map(g=>({name:g.name,avgPct:Math.round(g.got/g.max*1000)/10})).sort((a,b)=>a.avgPct-b.avgPct);
}
function compassData(analytics,t,lang){
  const B=analytics.bands||[], n=analytics.totalStudents||0, G=planGroups(B);
  const cnt=(idx)=>idx.reduce((a,i)=>a+(analytics.counts[i]||0),0);
  const fmt=(s,...v)=>v.reduce((x,val,i)=>x.split('%'+(i+1)).join(String(val)),s);
  const topics=topicStats(analytics);
  const weak=topics.filter(x=>x.avgPct<75).slice(0,3);
  const strong=topics.slice().reverse().filter(x=>x.avgPct>=75).slice(0,2);
  const list=(arr)=>arr.map(x=>`«${x.name}»: ${x.avgPct}%`).join(' | ');
  const bloom=(analytics.byBloom||[]).slice().sort((a,b)=>a.avgPct-b.avgPct)[0];
  const hard=(analytics.perQuestion||[]).slice().sort((a,b)=>a.avgPct-b.avgPct).slice(0,3).map(q=>`${q.qNum}${q.contentSkill?` – ${q.contentSkill}`:''}: ${q.avgPct}%`);
  const cls=(analytics.classes||[]).filter(c=>c.n).slice().sort((a,b)=>b.average-a.average);
  const situation=[fmt(t.sitAvg,(analytics.average||0).toFixed(1),cnt([0]),n?Math.round(cnt([0])/n*100)+'%':'0%',B[0]?B[0].name:'')];
  if(weak.length) situation.push(fmt(t.sitWeak,list(weak)));
  if(strong.length) situation.push(fmt(t.sitStrong,list(strong)));
  if(bloom) situation.push(fmt(t.sitBloom,bloom.name,bloom.avgPct));
  if(hard.length) situation.push(fmt(t.sitHard,hard.join(' | ')));
  if(cls.length>1) situation.push(fmt(t.sitClasses,cls[0].name,cls[0].average,cls[cls.length-1].name,cls[cls.length-1].average));
  const focus=(k)=>{const w=weak.length?weak:topics.slice(0,2);return w.slice(0,k).map(x=>`«${x.name}»`).join(lang==='en'?' and ':lang==='he'?' ו':' و');};
  const steps=[];
  if(topics.length) steps.push(fmt(t.stepWhole,topics[0].name,topics[0].avgPct));
  if(cnt(G.intensive)) steps.push(fmt(t.stepIntensive,cnt(G.intensive),focus(2)||'—'));
  if(cnt(G.strategic)) steps.push(fmt(t.stepStrategic,cnt(G.strategic),focus(3)||'—'));
  if(cnt(G.enrich)) steps.push(fmt(t.stepEnrich,cnt(G.enrich)));
  steps.push(t.stepReassess);
  /* RTL: keep "(45.6%)" intact next to Arabic/Hebrew text in Word and PDF */
  const fix=(x)=>lang==='en'?x:x.replace(/\(([^()]*)\)/g,'\u200F(\u2060$1\u2060)\u200F');
  return {situation:situation.map(fix),steps:steps.map(fix)};
}

const CompareFiles=({analytics,t,onError})=>{
  const [sets,setSets]=useState([]);
  const [busy,setBusy]=useState(false);
  const canvasRef=useRef(null), chartRef=useRef(null);
  const B=analytics.bands;
  const all=[{label:t.currentFile,a:analytics},...sets];
  const distPct=(a)=>{const d=buildDist(a.scores||[],B);const n=(a.scores||[]).length;return d.map(c=>n?Math.round(c/n*1000)/10:0);};
  const addFiles=async(e)=>{
    const files=[...(e.target.files||[])]; e.target.value='';
    if(!files.length) return;
    if(typeof ExcelJS==='undefined'){onError(t.excelLibErr);return;}
    setBusy(true);
    const add=[];
    for(const f of files){
      try{
        const res=await readScreeningWorkbook(ExcelJS,await f.arrayBuffer());
        if(!res.students.length) continue;
        add.push({label:f.name.replace(/\.xlsx$/i,''),a:analyticsFromWorkbook(res,res.bands||B)});
      }catch(err){ console.error(err); onError(t.uploadErr+'\n\n'+f.name); }
    }
    setSets(s=>[...s,...add]); setBusy(false);
  };
  const COLORS=['#2563eb','#f97316','#16a34a','#9333ea','#db2777','#0891b2','#ca8a04'];
  useEffect(()=>{
    if(!canvasRef.current||!sets.length) return;
    if(chartRef.current) chartRef.current.destroy();
    chartRef.current=new Chart(canvasRef.current.getContext('2d'),{
      type:'bar',
      data:{labels:B.map(b=>b.name),datasets:all.map((x,i)=>({label:x.label,data:distPct(x.a),backgroundColor:COLORS[i%COLORS.length],borderRadius:6}))},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{family:'Cairo'}}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>v+'%'}}}}
    });
    return ()=>{ if(chartRef.current){chartRef.current.destroy();chartRef.current=null;} };
  },[sets,analytics]);
  const bloomNames=[...new Set(all.flatMap(x=>(x.a.byBloom||[]).map(g=>g.name)))];
  const th={border:'1px solid #dbeafe',padding:'8px',background:'#eff6ff',fontWeight:700};
  const td={border:'1px solid #e5e7eb',padding:'8px',textAlign:'center'};
  return(
    <div className="p-5 bg-blue-50 border border-blue-200 rounded-2xl fade-in no-print">
      <h3 className="font-bold text-blue-700 mb-2">{t.compareTitle}</h3>
      <p style={{fontSize:'.85rem',color:'#475569',marginBottom:'12px'}}>{t.compareHint2}</p>
      <label style={{display:'inline-block',padding:'10px 22px',borderRadius:'12px',background:'#2563eb',color:'white',fontWeight:800,cursor:'pointer'}}>
        {busy?'⏳':t.compareUpload}
        <input type="file" accept=".xlsx" multiple onChange={addFiles} style={{display:'none'}}/>
      </label>
      {sets.length>0&&(
        <div className="mt-4 space-y-4">
          <div className="h-64 bg-white rounded-xl border p-3"><canvas ref={canvasRef}></canvas></div>
          <p style={{fontSize:'.75rem',color:'#64748b'}}>{t.cmpPctNote}</p>
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.83rem',background:'white'}}>
              <thead><tr>
                <th style={th}>{t.fileCol}</th><th style={th}>{t.classesCol}</th><th style={th}>{t.nCol}</th><th style={th}>{t.avgCol}</th>
                {B.map((b,i)=><th key={i} style={{...th,color:bandColor(B,i)}}>{b.name}</th>)}<th style={th}></th>
              </tr></thead>
              <tbody>{all.map((x,k)=>(
                <tr key={k}>
                  <td style={{...td,fontWeight:700,color:COLORS[k%COLORS.length]}}>{x.label}</td>
                  <td style={td}>{(x.a.classes||[]).map(c=>c.name).join('، ')}</td>
                  <td style={td}>{x.a.totalStudents}</td>
                  <td style={{...td,fontWeight:800}}>{(x.a.average||0).toFixed(1)}</td>
                  {distPct(x.a).map((v,i)=><td key={i} style={{...td,background:'#'+bandSoft(B,i)}}>{v}%</td>)}
                  <td style={td}>{k>0&&<button onClick={()=>setSets(s=>s.filter((_,j)=>j!==k-1))} style={{color:'#dc2626',fontWeight:700,cursor:'pointer'}}>✕ {t.removeFile}</button>}</td>
                </tr>))}
              </tbody>
            </table>
          </div>
          {bloomNames.length>0&&(
            <div style={{overflowX:'auto'}}>
              <div style={{fontWeight:800,color:'#1e3a5f',margin:'6px 0'}}>{t.bloomCmp}</div>

const MotivBanner=({analytics,t})=>{
  const top=analytics.counts?analytics.counts[analytics.counts.length-1]:0;
  const pct=analytics.totalStudents?(top/analytics.totalStudents)*100:0;
  let msg,color,bg;
  if(pct>=60){msg=t.motivHigh;color='#065f46';bg='#d1fae5';}
  else if(pct>=30){msg=t.motivMid;color='#92400e';bg='#fef3c7';}
  else{msg=t.motivLow;color='#991b1b';bg='#fee2e2';}
  return <div className="motiv-banner" style={{color,background:bg}}>💡 {msg}</div>;
};

async function doExportDocx(data){
  const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,AlignmentType,HeadingLevel,Footer,ImageRun,
    HorizontalPositionRelativeFrom,HorizontalPositionAlign,VerticalPositionRelativeFrom,VerticalPositionAlign,TextWrappingType}=docx;
  const t=data.t, lang=data.lang||'ar', rtl=lang!=='en';
  const run=(o)=>new TextRun({rightToLeft:rtl,...o});
  const P=(o)=>new Paragraph({bidirectional:rtl,...o});
  const mp=(txt)=>P({children:[run({text:String(txt),size:22})]});
  const mb=(txt)=>P({bullet:{level:0},children:[run({text:String(txt),size:22})]});
  const mh=(txt,c)=>P({heading:HeadingLevel.HEADING_2,children:[run({text:txt,bold:true,size:28,color:c||'1d4ed8'})]});
  const mc=(txt,bold,fill)=>new TableCell({
    shading:fill?{fill}:undefined,
    children:[P({alignment:AlignmentType.CENTER,children:[run({text:String(txt),bold:!!bold,size:20})]})]
  });
  const B=data.analytics.bands, G=planGroups(B);
  const gl=(k,base)=>base+' ('+G[k].map(i=>B[i].name).join(' / ')+')';
  const C=compassData(data.analytics,t,lang);
  const logo=await logoBytes();
  const footKids=[];
  if(logo){ try{ footKids.push(new ImageRun({data:logo,transformation:{width:16,height:16}})); footKids.push(run({text:'  '})); }catch(e){} }
  footKids.push(run({text:brandOf(lang),size:16,color:'9CA3AF'}));
  /* faint logo behind the first page only (anchored to the first paragraph, centred on the page) */
  const wm=await watermarkBytes(); let wmRun=null;
  if(wm){ try{ wmRun=new ImageRun({data:wm,transformation:{width:430,height:370},floating:{
    horizontalPosition:{relative:HorizontalPositionRelativeFrom.PAGE,align:HorizontalPositionAlign.CENTER},
    verticalPosition:{relative:VerticalPositionRelativeFrom.PAGE,align:VerticalPositionAlign.CENTER},
    behindDocument:true,allowOverlap:true,wrap:{type:TextWrappingType.NONE}}}); }catch(e){ wmRun=null; } }
  const doc2=new Document({sections:[{properties:{},
    footers:{default:new Footer({children:[P({alignment:AlignmentType.CENTER,children:footKids})]})},
    children:[
    P({alignment:AlignmentType.CENTER,children:[...(wmRun?[wmRun]:[]),run({text:t.planTitle,bold:true,size:36,color:'ea580c'})]}),
    P({alignment:AlignmentType.CENTER,children:[run({text:[data.teacher.grade,data.subjectName,data.teacher.date,data.teacher.name].filter(Boolean).join(' — '),size:22,color:'6b7280'})]}),
    P({}),
    mh('1. '+t.situationTitle,'0f766e'),
    ...C.situation.map(mb),
    P({}),
    mh('2. '+t.startTitle,'ea580c'),
    ...C.steps.map(mb),
    P({}),
    mh('3. '+t.distSection),
    mp(t.totalStudents+': '+data.analytics.totalStudents+'   •   '+t.avgLabel+': '+data.analytics.average.toFixed(1)),
    ...B.map((b,i)=>mb(`${b.name} (${bandRangeLabel(B,i)}): ${data.analytics.counts[i]}`)),
    P({}),
    mh('4. '+t.timeframe,'7c3aed'),
    mb(t.workPeriod+': '+(data.plan.period||t.notSet)),
    mb(t.weeklyHours+': '+(data.plan.hours||t.notSet)),
    mb(t.evalMethod+': '+(data.plan.assessment||t.notSet)),
    mb(t.reEvalDate+': '+(data.plan.reEvalDate||t.notSet)),
    mb(t.availableRes+': '+(data.plan.resources||t.notSet)),
    P({}),
    mh('5. '+t.strategiesTitle,'ea580c'),
    new Table({width:{size:100,type:WidthType.PERCENTAGE},visuallyRightToLeft:rtl,rows:[
      new TableRow({children:[mc(t.groupTarget,true,'dbeafe'),mc(t.strategy,true,'dbeafe')]}),
      new TableRow({children:[mc(gl('intensive',t.intensiveGroup),true,'fee2e2'),mc(t.intensiveStr)]}),
      new TableRow({children:[mc(gl('strategic',t.strategicGroup),true,'fef9c3'),mc(t.strategicStr)]}),
      new TableRow({children:[mc(gl('enrich',t.enrichGroup),true,'dcfce7'),mc(t.enrichStr)]}),
    ]}),
  ]}]});
  const blob=await Packer.toBlob(doc2);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='compass_'+(data.teacher.grade||'class')+'.docx';
  a.click();
}
