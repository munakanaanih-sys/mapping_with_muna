/* ══ MAIN APP ══ */
const App=()=>{
  // Draft is NEVER loaded automatically — only when user explicitly chooses
  const [lang,setLang]=useState(null);
  const UIKEY='wamadhat_ui_lang';
  const [splashLang,setSplashLang]=useState(()=>{try{const v=localStorage.getItem(UIKEY);return UI[v]?v:'ar';}catch{return 'ar';}});
  const [modalMsg,setModalMsg]=useState(null);
  const [showDraftPrompt,setShowDraftPrompt]=useState(false);
  const [draftData,setDraftData]=useState(null);
  const [subject,setSubject]=useState(null);
  const [phase,setPhase]=useState(0);
  const [teacher,setTeacher]=useState({name:'',grade:'',date:''});
  const [tableRaw,setTableRaw]=useState('');
  const [parsedQ,setParsedQ]=useState([]);
  const [gradesRaw,setGradesRaw]=useState('');
  const [analytics,setAnalytics]=useState(null);
  const [plan,setPlan]=useState({resources:'',period:'',hours:'',assessment:'',reEvalDate:''});
  const [showPlan,setShowPlan]=useState(false);
  const [savedMsg,setSavedMsg]=useState(false);
  const [showCompare,setShowCompare]=useState(false);
  const [bands,setBands]=useState(()=>presetBands('ar',4));
  const [nStudents,setNStudents]=useState(35);
  const [classes,setClasses]=useState([]);
  const [busy,setBusy]=useState(false);
  const [excelMade,setExcelMade]=useState(false);

  const chartRef=useRef(null);
  const canvasRef=useRef(null);
  const cmpChartRef=useRef(null);
  const cmpCanvasRef=useRef(null);

  const t={...UI[lang||'ar'],...(EX[lang||'ar']||EX.ar)};
  const dir=(lang==='ar'||lang==='he')?'rtl':'ltr';
  const sT=UI[splashLang]||UI.ar;
  const sDir=splashLang==='en'?'ltr':'rtl';

  // remember the chosen language and keep the page's lang/dir/title in step with it
  useEffect(()=>{
    const cur=lang||splashLang;
    try{localStorage.setItem(UIKEY,cur);}catch{}
    if(lang&&lang!==splashLang) setSplashLang(lang);
    document.documentElement.lang=cur;
    document.documentElement.dir=cur==='en'?'ltr':'rtl';
    document.title=(UI[cur]||UI.ar).mainTitle;
  },[lang,splashLang]);

  // switch the language at any step without losing the teacher's work
  const changeLang=(l)=>{
    if(!UI[l]||l===lang) return;
    setBands(b=>{
      // band names that are still the untouched preset follow the new language
      const p=presetBands(lang||'ar',b.length);
      const untouched=p.length===b.length&&b.every((x,i)=>x.name===p[i].name);
      if(!untouched) return b;
      const np=presetBands(l,b.length);
      return b.map((x,i)=>({...x,name:np[i].name}));
    });
    setLang(l);
  };
  const sm=subject?SUBJECT_META[subject]:null;

  // ── Draft handlers ──
  const handleContinueDraft=()=>{
    if(!draftData) return;
    const d=draftData;
    if(d.lang)      setLang(d.lang);
    if(d.subject)   setSubject(d.subject);
    if(d.phase)     setPhase(d.phase);
    if(d.teacher)   setTeacher(d.teacher);
    if(d.tableRaw)  setTableRaw(d.tableRaw);
    if(d.parsedQ)   setParsedQ(d.parsedQ);
    if(d.parsedQ&&d.parsedQ.length) setExcelMade(true);
    if(d.gradesRaw) setGradesRaw(d.gradesRaw);
    const nbd=normalizeBands(d.bands);
    const db=(nbd&&!validateBands(nbd))?nbd:presetBands(d.lang||'ar',4);
    setBands(db);
    if(d.nStudents) setNStudents(d.nStudents);
    if(Array.isArray(d.classes)) setClasses(d.classes);
    if(d.analytics) setAnalytics(normalizeAnalytics(d.analytics,db));
    if(d.plan)      setPlan(d.plan);
    setShowDraftPrompt(false);
    setDraftData(null);
  };

  const handleFreshStart=()=>{
    // Clear saved draft completely
    try{localStorage.removeItem(KEY);}catch{}
    setTeacher({name:'',grade:'',date:''});
    setSubject(null); setPhase(0);
    setTableRaw(''); setParsedQ([]); setExcelMade(false);
    setGradesRaw(''); setAnalytics(null);
    setBands(presetBands(lang||'ar',4)); setNStudents(35); setClasses([]);
    setPlan({resources:'',period:'',hours:'',assessment:'',reEvalDate:''});
    setShowDraftPrompt(false);
    setDraftData(null);
  };

  const handleSave=()=>{
    sd({lang,subject,phase,teacher,tableRaw,parsedQ,gradesRaw,analytics,plan,bands,nStudents,classes});
    setSavedMsg(true);setTimeout(()=>setSavedMsg(false),2000);
  };

  const BackBtn=({to,label})=>(
    <button onClick={()=>{setPhase(to);setShowPlan(false);setSubject(to===0?null:subject);}}
      className="no-print"
      style={{
        display:'inline-flex',alignItems:'center',gap:'8px',
        padding:'10px 22px',borderRadius:'14px',
        background:'linear-gradient(135deg,#1e3a5f,#0f2749)',
        color:'white',fontWeight:700,fontSize:'1rem',
        border:'none',cursor:'pointer',
        boxShadow:'0 4px 14px rgba(15,39,73,.35)',
        transition:'all .2s'
      }}
      onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow='0 8px 20px rgba(15,39,73,.45)';}}
      onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='0 4px 14px rgba(15,39,73,.35)';}}>
      <span style={{fontSize:'1.1rem'}}>{dir==='rtl'?'→':'←'}</span>
      {label||t.back}
    </button>
  );
  const hasDraft=()=>{try{const k=localStorage.getItem(KEY);return !!(k&&JSON.parse(k)?.teacher?.name);}catch{return false;}};
  const SaveBtn=()=>(
    <div className="no-print" style={{display:'flex',gap:'8px',alignItems:'center'}}>
      <button onClick={handleSave}
        style={{padding:"10px 20px",borderRadius:"12px",border:"2px solid",borderColor:savedMsg?"#4ade80":"#d1d5db",color:savedMsg?"#16a34a":"#6b7280",background:savedMsg?"#f0fdf4":"white",fontWeight:700,fontSize:"1rem",cursor:"pointer",transition:'all .2s'}}>
        {savedMsg?`✓ ${t.saved}`:t.save}
      </button>
      {hasDraft()&&<button onClick={()=>{try{localStorage.removeItem(KEY);}catch{}setModalMsg(t.draftCleared||'✔ تم محو المسودة');}}
        title={t.clearDraft||'محو المسودة'}
        style={{padding:"10px 14px",borderRadius:"12px",border:"2px solid #fecaca",color:"#dc2626",background:"#fff5f5",fontWeight:700,fontSize:".9rem",cursor:"pointer"}}>
        🗑
      </button>}
    </div>
  );

  useEffect(()=>{
    if(phase===3&&analytics&&analytics.counts&&canvasRef.current){
      if(chartRef.current) chartRef.current.destroy();
      const B=analytics.bands;
      chartRef.current=new Chart(canvasRef.current.getContext('2d'),{
        type:'doughnut',
        data:{labels:B.map((b,i)=>`${b.name} (${bandRangeLabel(B,i)})`),datasets:[{data:analytics.counts,backgroundColor:B.map((b,i)=>bandColor(B,i)),hoverOffset:8}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11,family:'Cairo'},padding:12}}}}
      });
    }
  },[phase,analytics]);


  // keep the draft in sync whenever results or ranges change (avoids saving stale state)
  useEffect(()=>{
    if(lang&&teacher.name) sd({lang,subject,phase,teacher,tableRaw,parsedQ,gradesRaw,analytics,plan,bands,nStudents,classes});
  },[analytics,bands,nStudents,classes]);

  const classList=classes.length?classes:defaultClassNames(lang||'ar',1,teacher.grade);

  const generateExcel=async()=>{
    const data=parseExamReply(tableRaw);
    if(!data){
      const msg = t.badTable + '\n\n' + (
        t.badTableHelp ||
        'Example format:\n| Section | Q | Bloom Skill | Content Skill | Score |\n|---|---|---|---|---|\n| A | 1 | Understand | Reading | 10 |'
      );
      setModalMsg(msg);
      return;
    }
    const be=validateBands(bands);
    if(be){setModalMsg(t.bandErr[be]);return;}
    const ce=validateClasses(classList);
    if(ce){setModalMsg(t[ce]);return;}
    if(typeof ExcelJS==='undefined'){setModalMsg(t.excelLibErr);return;}
    setParsedQ(data);
    setBusy(true);
    try{
      const wb=await buildScreeningWorkbook(ExcelJS,{questions:data,bands,lang:lang||'ar',teacher,
        subjectName:t.subjects[subject]||subject||'',nStudents,classes:classList.map(c=>String(c).trim())});
      setExcelMade(true);
      await downloadWorkbook(wb,`ClassScan_${(teacher.grade||'class').replace(/[\\/:*?"<>|]/g,'_')}.xlsx`);
      const totalMax=data.reduce((a,q)=>a+q.max,0);

      console.error(e);

    if(typeof ExcelJS==='undefined'){setModalMsg(t.excelLibErr);return;}

      const res=await readScreeningWorkbook(ExcelJS,await f.arrayBuffer());

      const B=res.bands||bands;

      setParsedQ(res.questions);
      setAnalytics(analyticsFromWorkbook(res,B));
      setPhase(3);

      console.error(err);
      setModalMsg(t.uploadErr);
    }finally{setBusy(false);}

    if(!analytics) return;
    if(typeof ExcelJS==='undefined'){setModalMsg(t.excelLibErr);return;}

  /* ═══ SPLASH ═══ */

    {showDraftPrompt && draftData && <DraftPrompt t={t} draft={draftData} onContinue={handleContinueDraft} onFresh={handleFreshStart} dir={dir}/>}

      <div style={{position:'absolute',bottom:'-100px',left:'-100px',width:'500px',height:'500px',borderRadius:'50%',background:'radial-gradient(circle,rgba(59,130,246,.15),transparent 70%)',pointerEvents:'none'}}/>
      <div style={{position:'absolute',top:'40%',left:'5%',width:'200px',height:'200px',borderRadius:'50%',background:'radial-gradient(circle,rgba(139,92,246,.12),transparent 70%)',pointerEvents:'none'}}/>

          display:'flex',alignItems:'center',justifyContent:'center',

        </div>

            ['ar', UI.ar.langBtns.ar, 'linear-gradient(135deg,#3b82f6,#1d4ed8)', '🇸🇦', 'العربية'],
            ['he', UI.he.langBtns.he, 'linear-gradient(135deg,#8b5cf6,#6d28d9)', '⭐', 'עברית'],
            ['en', UI.en.langBtns.en, 'linear-gradient(135deg,#f59e0b,#d97706)', '🌐', 'English']
          ].map(([l,lbl,bg,flag,sub])=>(
            <button key={l} onClick={()=>{
              const saved=ld();
              setSplashLang(l);
              setLang(l);
              setBands(presetBands(l,4));
              if(saved&&saved.teacher&&saved.teacher.name){
                setDraftData(saved);
                setShowDraftPrompt(true);
              }
            }}
            style={{
              flex:'1',minWidth:'140px',maxWidth:'180px',
              padding:'20px 16px',borderRadius:'20px',
              background:bg,
              color:'white',fontWeight:800,fontSize:'1.05rem',
              border:'none',cursor:'pointer',
              boxShadow:'0 8px 24px rgba(0,0,0,.35)',
              transition:'all .25s',
              display:'flex',flexDirection:'column',alignItems:'center',gap:'8px',
              fontFamily:"'Cairo',sans-serif"
            }}
            onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-4px)';e.currentTarget.style.boxShadow='0 16px 36px rgba(0,0,0,.45)';}}
            onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='0 8px 24px rgba(0,0,0,.35)';}}>
              <span style={{fontSize:'1.6rem'}}>{flag}</span>
              <span>{lbl}</span>
            </button>
          ))}
        </div>
      </div>

      {/* Bottom decorative line */}
      <div style={{marginTop:'40px',color:'rgba(255,255,255,.3)',fontSize:'.78rem',fontWeight:600,position:'relative',zIndex:1}}>
        ✦ &nbsp; {sT.splashFooter} &nbsp; ✦
      </div>
    </div>
    </>
  );

  /* ═══ SUBJECT PICK ═══ */
  if(!subject) return(
    <>
    <Modal msg={modalMsg} onClose={()=>setModalMsg(null)}/>
    {showDraftPrompt && draftData && <DraftPrompt t={t} draft={draftData} onContinue={handleContinueDraft} onFresh={handleFreshStart} dir={dir}/>}
    <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#f0f9ff 0%,#fdf4ff 50%,#fff7ed 100%)'}} dir={dir}>
      <div style={{maxWidth:'900px',margin:'0 auto',background:'rgba(255,255,255,.97)',boxShadow:'0 4px 40px rgba(0,0,0,.15)',minHeight:'100vh'}}>
        <SiteHeader t={t} lang={lang} onLang={changeLang}/>
        <div className="p-8">
          <button onClick={()=>setLang(null)} className="no-print" style={{display:'inline-flex',alignItems:'center',gap:'8px',padding:'10px 22px',borderRadius:'14px',background:'linear-gradient(135deg,#1e3a5f,#0f2749)',color:'white',fontWeight:700,fontSize:'1rem',border:'none',cursor:'pointer',boxShadow:'0 4px 14px rgba(15,39,73,.35)',marginBottom:'20px'}}>
            <span>{dir==='rtl'?'→':'←'}</span> {t.back}
          </button>
          <div className="text-center mb-2">
            <h2 className="text-2xl font-black text-gray-800">{t.pickSubject}</h2>
            <p className="text-gray-400 text-sm mt-1">{t.subjectHint}</p>
          </div>
          <SubjectPicker selected={subject} onChange={s=>{setSubject(s);setPhase(1);}} t={t}/>
        </div>
      </div>
    </div>
    </>
  );

  /* ═══ WORKFLOW ═══ */
  return(
    <>
    <Modal msg={modalMsg} onClose={()=>setModalMsg(null)}/>
    <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#f0f9ff 0%,#fdf4ff 50%,#fff7ed 100%)'}} dir={dir}>
      <div style={{maxWidth:'900px',margin:'0 auto',background:'rgba(255,255,255,.97)',boxShadow:'0 4px 40px rgba(0,0,0,.15)',borderRadius:'0 0 24px 24px',minHeight:'100vh'}}>
        <MiniHeader t={t} lang={lang} onLang={changeLang}/>
        <div style={{padding:'0 32px 56px'}}>
          <StepBar phase={phase} t={t}/>

          {/* ── Phase 1: Teacher Info ── */}
          {phase===1&&(
            <div className="fade-in space-y-6">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px",paddingBottom:"16px",borderBottom:"2px solid #f1f5f9"}}><BackBtn to={0}/><SaveBtn/></div>
              <h2 style={{fontSize:"1.6rem",fontWeight:900,color:"#1e3a5f",marginBottom:"8px"}}>{t.step1}</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                {[['name',t.teacherName,'text',''],['grade',t.gradeLabel,'text',''],['date',t.examDate,'date','']].map(([k,lbl,type,ph])=>(
                  <div key={k}>
                    <label style={{display:"block",fontSize:"1rem",fontWeight:700,color:"#374151",marginBottom:"6px"}}>{lbl}</label>
                    <input type={type} value={teacher[k]} placeholder={ph}
                      onChange={e=>setTeacher({...teacher,[k]:e.target.value})}
                      style={{width:"100%",padding:"14px 16px",borderRadius:"14px",border:"2px solid #e5e7eb",outline:"none",fontSize:"1.05rem",fontFamily:"Cairo,sans-serif",transition:"border-color .2s"}}
                      onFocus={e=>e.target.style.borderColor="#f97316"}
                      onBlur={e=>e.target.style.borderColor="#e5e7eb"}/>
                  </div>
                ))}
                <div>
                  <label style={{display:"block",fontSize:"1rem",fontWeight:700,color:"#374151",marginBottom:"6px"}}>{t.subjectLabel}</label>
                  <div style={{padding:"14px 16px",borderRadius:"14px",border:"2px solid #e5e7eb",background:"#f9fafb",fontWeight:700,fontSize:"1.05rem",display:"flex",alignItems:"center",gap:"10px",color:sm.color}}>
                    {sm.icon} {t.subjects[subject]}
                  </div>
                </div>
              </div>
              <div className="flex justify-between items-center pt-2">
                <button onClick={()=>{setSubject(null);setParsedQ([]);}} className="text-sm text-gray-400 hover:text-orange-500 no-print">
                  🔄 {t.pickSubject}
                </button>
                <button onClick={()=>{
                  if(!teacher.name||!teacher.grade||!teacher.date){setModalMsg(t.fillAll);return;}
                  setPhase(2);handleSave();
                }} className="glow-orange bg-gradient-to-r from-orange-500 to-amber-400 text-white font-bold px-8 py-3 rounded-full cursor-pointer">
                  {t.next} {dir==='rtl'?'←':'→'}
                </button>
              </div>
            </div>
          )}

          {/* ── Phase 2: Exam Structure ── */}
          {phase===2&&(
            <div className="fade-in space-y-6">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px",paddingBottom:"16px",borderBottom:"2px solid #f1f5f9"}}><BackBtn to={1}/><SaveBtn/></div>
              <ClaudeExamCard prompt={buildClaudeExamPrompt(lang||'ar',t.subjects[subject]||'',subject,teacher.grade)} t={t}/>
              <div>
                <label style={{display:"block",fontSize:"1rem",fontWeight:700,color:"#374151",marginBottom:"8px"}}>{t.pasteClaude}</label>
                <textarea rows="6" value={tableRaw} onChange={e=>{const v=e.target.value;setTableRaw(v);const d=parseExamReply(v);setParsedQ(d||[]);}}
                  style={{width:"100%",padding:"14px 16px",borderRadius:"14px",border:"2px solid #e5e7eb",outline:"none",fontFamily:"monospace",fontSize:".95rem",background:"#f9fafb",direction:"auto",textAlign:"start"}} dir="auto"/>
              </div>
              {parsedQ.length>0&&tableRaw&&<div style={{color:'#15803d',fontWeight:700,fontSize:'.9rem'}}>{t.parsedOk.replace('%1',parsedQ.length).replace('%2',parsedQ.reduce((a,q)=>a+q.max,0))}</div>}
              {parsedQ.length>0&&<TablePreview data={parsedQ} t={t} lang={lang}/>}
              <ClassEditor classes={classList} setClasses={setClasses} lang={lang||'ar'} t={t} grade={teacher.grade} nStudents={nStudents} setNStudents={setNStudents}/>
              <BandEditor bands={bands} setBands={setBands} lang={lang||'ar'} t={t}/>
              <button onClick={generateExcel} disabled={busy} className="glow-teal w-full bg-gradient-to-r from-teal-500 to-emerald-500 text-white font-bold text-lg py-4 rounded-2xl cursor-pointer" style={{opacity:busy?.6:1}}>
                {busy?`⏳ ${t.excelBuilding}`:`📊 ${t.generateExcel}`}
              </button>
              <div className="mt-2 p-5 rounded-2xl bg-amber-50 border border-amber-200 fade-in">
                {excelMade&&parsedQ.length>0&&<p style={{fontSize:"1rem",fontWeight:700,color:"#92400e",marginBottom:"12px"}}>✅ {t.excelOk}</p>}
                <div style={{background:'white',border:'2px dashed #f59e0b',borderRadius:'14px',padding:'16px',textAlign:'center'}}>
                  <div style={{fontWeight:800,color:'#1e3a5f',marginBottom:'4px'}}>{t.uploadTitle}</div>
                  <div style={{fontSize:'.85rem',color:'#6b7280',marginBottom:'10px'}}>{excelMade&&parsedQ.length>0?t.uploadHint:t.uploadAnyTime}</div>
                  <label style={{display:'inline-block',padding:'12px 26px',borderRadius:'14px',background:'linear-gradient(135deg,#7c3aed,#db2777)',color:'white',fontWeight:800,cursor:'pointer'}}>
                    {busy?'⏳':t.uploadBtn}
                    <input type="file" accept=".xlsx" onChange={handleUpload} style={{display:'none'}}/>
                  </label>
                </div>
              </div>
            </div>
          )}
          {/* ── Phase 3: Analysis + Plan ── */}
          {phase===3&&analytics&&(
            <div className="fade-in space-y-8">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px",paddingBottom:"16px",borderBottom:"2px solid #f1f5f9"}} className="no-print"><BackBtn to={2}/><SaveBtn/></div>
              <MotivBanner analytics={analytics} t={t}/>
              <div>
                <h2 className="text-xl font-bold text-gray-800 text-center mb-4">{t.dist}</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-5 items-center">
                  <div className="h-64 bg-gray-50 rounded-2xl border p-3"><canvas ref={canvasRef}></canvas></div>
                  <div className="rounded-2xl border overflow-hidden">
                    <table className="w-full text-center text-sm">
                      <thead className="bg-gray-100">
                        <tr><th className="py-2 px-3">{t.range}</th><th className="py-2 px-3">{t.count}</th><th className="py-2 px-3">{t.pct}</th></tr>
                      </thead>
                      <tbody className="divide-y">
                        {analytics.bands.map((b,i)=>(
                          <tr key={i} style={{background:'#'+bandSoft(analytics.bands,i)}}>
                            <td className="py-2 font-bold" style={{color:bandColor(analytics.bands,i)}}>{b.name}<div style={{fontSize:'.72rem',fontWeight:600,opacity:.8}}>{bandRangeLabel(analytics.bands,i)}</div></td>
                            <td className="py-2 font-bold">{analytics.counts[i]}</td>
                            <td className="py-2 font-semibold" style={{color:bandColor(analytics.bands,i)}}>{analytics.totalStudents?((analytics.counts[i]/analytics.totalStudents)*100).toFixed(1):0}%</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                    <div className="bg-gray-50 px-4 py-2 text-xs text-center font-bold text-gray-500 flex justify-around">
                      <span>{t.totalStudents}: <strong>{analytics.totalStudents}</strong></span>
                      <span>{t.avgLabel}: <strong>{analytics.average.toFixed(1)}</strong></span>
                    </div>
                  </div>
                </div>
              </div>
              <DeepAnalysis analytics={analytics} t={t}/>
              <ClaudeReportCard analytics={analytics} t={t} lang={lang||'ar'} subject={subject} subjectName={t.subjects[subject]||''} teacher={teacher}/>
              <div className="flex flex-wrap gap-3 no-print">
                <button onClick={exportLists} className="glow-teal px-5 py-2 rounded-xl bg-teal-600 text-white text-sm font-bold cursor-pointer">
                  📋 {t.exportList}
                </button>
                <button onClick={()=>setShowCompare(!showCompare)} className="px-5 py-2 rounded-xl border-2 border-blue-400 text-blue-600 text-sm font-bold hover:bg-blue-50 transition cursor-pointer">
                  🔄 {t.compareBtn}
                </button>
              </div>
              {showCompare&&<CompareFiles analytics={analytics} t={t} onError={setModalMsg}/>}
              {!showPlan&&(
                <div className="bg-white border-2 border-dashed border-gray-200 rounded-2xl p-6 space-y-4 no-print">
                  <h3 style={{fontSize:"1.4rem",fontWeight:800,color:"#1e3a5f",marginBottom:"4px"}}>{t.interventionTitle}</h3>
                  <p style={{fontSize:'.88rem',color:'#6b7280',marginTop:'-6px'}}>{t.compassHint}</p>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {[['resources',t.resources,t.resourcesHint,'text','md:col-span-2'],['period',t.period,t.periodHint,'text',''],['hours',t.hours,t.hoursHint,'text',''],['assessment',t.assessment,t.assessmentHint,'text',''],['reEvalDate',t.reEval,'','date','']].map(([k,lbl,ph,type,ex])=>(
                      <div key={k} className={ex}>
                        <label style={{display:"block",fontSize:"1rem",fontWeight:700,color:"#374151",marginBottom:"6px"}}>{lbl}</label>
                        <input type={type} value={plan[k]} placeholder={ph}
                          onChange={e=>setPlan({...plan,[k]:e.target.value})}
                          style={{width:"100%",padding:"13px 16px",borderRadius:"13px",border:"2px solid #e5e7eb",outline:"none",fontSize:"1rem",fontFamily:"Cairo,sans-serif"}}
                          onFocus={e=>e.target.style.borderColor="#f97316"}
                          onBlur={e=>e.target.style.borderColor="#e5e7eb"}/>
                      </div>
                    ))}
                  </div>
                  <button onClick={()=>setShowPlan(true)} className="glow-orange w-full bg-gradient-to-r from-gray-800 to-gray-700 text-white font-bold py-3 rounded-xl cursor-pointer">
                    ✨ {t.generatePlan}
                  </button>
                </div>
              )}
              {showPlan&&(
                <div id="plan-print-area" className="bg-white rounded-2xl border shadow-sm p-6 md:p-8 space-y-6 fade-in print-ok" dir={dir}>
                  <div className="flex flex-wrap gap-3 justify-end no-print">
                    <button onClick={()=>setShowPlan(false)} style={{display:'inline-flex',alignItems:'center',gap:'8px',padding:'10px 22px',borderRadius:'14px',background:'linear-gradient(135deg,#1e3a5f,#0f2749)',color:'white',fontWeight:700,fontSize:'1rem',border:'none',cursor:'pointer',boxShadow:'0 4px 14px rgba(15,39,73,.35)'}}>
                      <span>{dir==='rtl'?'→':'←'}</span> {t.back}
                    </button>
                    <button onClick={()=>doExportDocx({t,analytics,plan,teacher,lang:lang||'ar',subjectName:t.subjects[subject]||''}).catch(e=>{console.error(e);setModalMsg(String(e&&e.message||e));})} className="glow-blue px-4 py-2 rounded-xl bg-blue-600 text-white text-sm font-bold cursor-pointer">📄 {t.downloadDocx}</button>
                    <button onClick={doExportPDF} className="px-4 py-2 rounded-xl bg-red-600 text-white text-sm font-bold hover:bg-red-700 transition cursor-pointer">📑 {t.downloadPdf}</button>
                    <button onClick={()=>window.print()} className="px-4 py-2 rounded-xl bg-gray-800 text-white text-sm font-bold hover:bg-gray-700 transition cursor-pointer">🖨️ {t.print}</button>
                  </div>
                  <div className="text-center border-b-2 border-orange-100 pb-5" style={{background:'linear-gradient(135deg,#fff7ed,#fff)',borderRadius:'16px',padding:'24px'}}>
                    <img src={LOGO} alt="logo" style={{width:'58px',height:'58px',borderRadius:'12px',objectFit:'cover',margin:'0 auto 10px'}} onError={e=>e.target.style.display='none'}/>
                    <div style={{fontSize:'1.4rem',fontWeight:900,color:'#ea580c'}}>{t.mainTitle}</div>
                    <div style={{fontSize:'.82rem',fontWeight:700,color:'#92400e',marginTop:'4px'}}>{t.mainSub}</div>
                    <div style={{fontSize:'1.05rem',fontWeight:700,color:'#1f2937',marginTop:'10px'}}>{t.planTitle}</div>
                    <div style={{fontSize:'.78rem',color:'#6b7280',marginTop:'4px'}}>{teacher.grade} — {t.subjects[subject]} — {teacher.date}</div>
                    <div style={{fontSize:'.73rem',color:'#9ca3af'}}>{teacher.name}</div>
                  </div>
                  {(()=>{const C=compassData(analytics,t,lang||'ar');return(<>
                    <section>
                      <h3 style={{fontSize:'1.05rem',fontWeight:700,color:'#0f766e',borderBottom:'2px solid #ccfbf1',paddingBottom:'6px',marginBottom:'10px'}}>1. {t.situationTitle}</h3>
                      <ul style={{display:'grid',gap:'6px',fontSize:'.9rem',color:'#1f2937',paddingInlineStart:'20px',listStyle:'disc'}}>{C.situation.map((x,i)=><li key={i}>{x}</li>)}</ul>
                    </section>
                    <section>
                      <h3 style={{fontSize:'1.05rem',fontWeight:700,color:'#ea580c',borderBottom:'2px solid #fed7aa',paddingBottom:'6px',marginBottom:'10px'}}>2. {t.startTitle}</h3>
                      <ol style={{display:'grid',gap:'6px',fontSize:'.9rem',color:'#1f2937',paddingInlineStart:'20px',listStyle:'decimal'}}>{C.steps.map((x,i)=><li key={i}>{x}</li>)}</ol>
                    </section>
                  </>);})()}
                  <section>
                    <h3 style={{fontSize:'1.05rem',fontWeight:700,color:'#1d4ed8',borderBottom:'2px solid #dbeafe',paddingBottom:'6px',marginBottom:'10px'}}>3. {t.distSection}</h3>
                    <ul style={{listStyle:'none',display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',fontSize:'.88rem'}}>
                      {[['📊 '+t.totalStudents,analytics.totalStudents,'#374151'],...analytics.bands.map((b,k)=>[`● ${b.name} (${bandRangeLabel(analytics.bands,k)})`,analytics.counts[k],bandColor(analytics.bands,k)]),['📈 '+t.avgLabel,analytics.average.toFixed(1),'#374151']].map(([lbl,val,c])=>(
                        <li key={lbl} style={{background:'#f9fafb',borderRadius:'10px',padding:'8px 12px',color:c}}><strong>{lbl}:</strong> {val}</li>
                      ))}
                    </ul>
                  </section>
                  <section>
                    <h3 style={{fontSize:'1.05rem',fontWeight:700,color:'#7c3aed',borderBottom:'2px solid #ede9fe',paddingBottom:'6px',marginBottom:'10px'}}>4. {t.timeframe}</h3>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',fontSize:'.85rem'}}>
                      {[[t.workPeriod,plan.period||t.notSet],[t.weeklyHours,plan.hours||t.notSet],[t.evalMethod,plan.assessment||t.notSet],[t.reEvalDate,plan.reEvalDate||t.notSet],[t.availableRes,plan.resources||t.notSet]].map(([k,v])=>(
                        <div key={k} style={{background:'#faf5ff',borderRadius:'10px',padding:'10px 12px',border:'1px solid #ede9fe'}}>
                          <div style={{fontWeight:700,color:'#6d28d9',fontSize:'.78rem'}}>{k}</div>
                          <div style={{color:'#1f2937',marginTop:'3px'}}>{v}</div>
                        </div>
                      ))}
                    </div>
                  </section>
                  <section>
                    <h3 style={{fontSize:'1.05rem',fontWeight:700,color:'#ea580c',borderBottom:'2px solid #fed7aa',paddingBottom:'6px',marginBottom:'10px'}}>5. {t.strategiesTitle}</h3>
                    <div style={{overflowX:'auto'}}>
                      <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.83rem'}}>
                        <thead>
                          <tr style={{background:'#f1f5f9'}}>
                            <th style={{border:'1px solid #e5e7eb',padding:'10px',width:'28%',textAlign:'center'}}>{t.groupTarget}</th>
                            <th style={{border:'1px solid #e5e7eb',padding:'10px',textAlign:'start'}}>{t.strategy}</th>
                          </tr>
                        </thead>
                        <tbody>
                          {(()=>{const G=planGroups(analytics.bands),nm=(k)=>G[k].map(i=>analytics.bands[i].name).join(' / ');return [[t.intensiveGroup,'#dc2626','#fee2e2',t.intensiveStr,nm('intensive')],[t.strategicGroup,'#d97706','#fef9c3',t.strategicStr,nm('strategic')],[t.enrichGroup,'#059669','#dcfce7',t.enrichStr,nm('enrich')]];})().map(([grp,c,bg,str,sub])=>(
                            <tr key={grp} style={{background:bg}}>
                              <td style={{border:'1px solid #e5e7eb',padding:'10px',fontWeight:700,textAlign:'center',color:c}}>{grp}<div style={{fontSize:'.72rem',fontWeight:600,color:'#6b7280',marginTop:'2px'}}>{sub}</div></td>
                              <td style={{border:'1px solid #e5e7eb',padding:'10px',color:'#374151'}}>{str}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </section>
                  <p style={{fontSize:'.72rem',color:'#9ca3af',textAlign:'center',paddingTop:'8px',display:'flex',alignItems:'center',justifyContent:'center',gap:'6px'}}><img src={LOGO} alt="" style={{width:'16px',height:'16px',borderRadius:'4px'}} onError={e=>e.target.style.display='none'}/>{brandOf(lang||'ar')} — {new Date().toLocaleDateString()}</p>
                </div>
              )}
            </div>
          )}
          <div className="no-print" style={{marginTop:"40px",paddingTop:"16px",borderTop:"1px solid #f1f5f9",textAlign:"center",fontSize:".8rem",color:"#9ca3af"}}>{t.mainTitle} — v5.0</div>
        </div>
      </div>
    </div>
    </>
  );
};

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
